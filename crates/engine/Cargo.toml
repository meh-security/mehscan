[package]
name = "mehscan-engine"
version = "0.1.0"
description = "Deterministic source analysis and bounded security relationships for Mehscan"
edition.workspace = true
rust-version.workspace = true
license = "Apache-2.0"
publish = false

[dependencies]
mehscan-core = { path = "../core" }
ast-grep-core = { workspace = true, features = ["tree-sitter"] }
ast-grep-config.workspace = true
ast-grep-language = { workspace = true, features = [
  "tree-sitter-c-sharp",
  "tree-sitter-go",
  "tree-sitter-java",
  "tree-sitter-javascript",
  "tree-sitter-python",
  "tree-sitter-rust",
  "tree-sitter-typescript",
] }
ast-grep-outline.workspace = true
serde.workspace = true
serde_json = "1.0.116"
serde_yaml.workspace = true
ignore.workspace = true
