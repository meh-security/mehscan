[package]
name = "mehscan-cli"
version = "0.14.0"
description = "Command-line interface for the Mehscan evidence-first source security scanner"
edition.workspace = true
rust-version.workspace = true
license = "Apache-2.0"
publish = false

[[bin]]
name = "mehscan"
path = "src/main.rs"

[dependencies]
fs2 = "0.4.3"
mehscan-core = { path = "../core" }
mehscan-engine = { path = "../engine" }
miniz_oxide = "0.8.9"
same-file = "1.0.6"
serde.workspace = true
serde_json = "1.0.116"
sha2 = "0.10.9"
tokio = { version = "1", features = ["rt", "time"] }
turso = { version = "=0.8.3", default-features = false, features = ["pure-rust-crypto", "sync"] }
