- id: python-sax-external-entity-parser
  version: 1
  title: Python SAX or pulldom XML parsing with an explicit parser
  language: python
  kind: sink
  capability: xml_parsing
  confidence: medium
  cwe: [CWE-611]
  match:
    any:
      - pattern: parseString($PAYLOAD, parser=$PARSER)
        captures: { payload: PAYLOAD, parser: PARSER }
      - pattern: pulldom.parseString($PAYLOAD, parser=$PARSER)
        captures: { payload: PAYLOAD, parser: PARSER }
      - pattern: xml.dom.pulldom.parseString($PAYLOAD, parser=$PARSER)
        captures: { payload: PAYLOAD, parser: PARSER }
  tags: [xml, xxe, sax, pulldom, external-entity, python]
  ai:
    investigate:
      - whether the payload is controlled by an HTTP request, upload, message, or external service
      - whether the exact parser has feature_external_ges or feature_external_pes enabled
      - whether entity expansion can read local files or perform network requests
  provenance:
    note: Python SAX or pulldom parsing with an explicit parser is review evidence; the parser feature configuration decides XXE exposure.
    references:
      - https://cwe.mitre.org/data/definitions/611.html
      - https://docs.python.org/3/library/xml.html#xml-vulnerabilities
