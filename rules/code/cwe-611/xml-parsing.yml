- id: javascript-libxml2-xxe-parser
  version: 1
  title: JavaScript libxml2 XML parsing with explicit options
  language: javascript
  kind: sink
  capability: xml_parsing
  confidence: medium
  cwe: [CWE-611]
  match: &javascript_libxml2_match
    any:
      - pattern: '$LIBXML.XmlDocument.fromString($PAYLOAD, { option: $OPTIONS })'
        captures: { payload: PAYLOAD, options: OPTIONS }
      - pattern: '$LIBXML.XmlDocument.fromString($PAYLOAD, { option: $OPTIONS, $$$REST })'
        captures: { payload: PAYLOAD, options: OPTIONS }
      - pattern: '$LIBXML.parseXmlString($PAYLOAD, { noent: true })'
        captures: { payload: PAYLOAD }
      - pattern: '$LIBXML.parseXmlString($PAYLOAD, { noent: true, $$$REST })'
        captures: { payload: PAYLOAD }
  tags: [xml, xxe, libxml2, external-entity]
  ai: &xxe_guidance
    investigate:
      - whether the XML payload originates from an upload, request, message, or external service
      - whether entity substitution, DTD loading, filesystem, or network input providers are enabled
      - whether the same parser invocation disables external entities and network access
  provenance: &libxml2_provenance
    note: Explicit libxml2 XmlDocument parsing is mapped to CWE-611 review; option semantics and input provenance decide exploitability.
    references:
      - https://cwe.mitre.org/data/definitions/611.html
      - https://cheatsheetseries.owasp.org/cheatsheets/XML_External_Entity_Prevention_Cheat_Sheet.html

