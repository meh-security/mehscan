- id: rust-file-content-input
  version: 1
  title: Rust external file content input
  language: rust
  kind: source
  capability: external_input
  confidence: medium
  cwe: [CWE-20]
  match:
    any:
      - pattern: $READ_FUNCTION($PATH)
        captures: { path: PATH }
  tags: [external-input, filesystem, rust]
  ai:
    investigate:
      - who can create or modify the file at deployment and runtime
      - whether the returned content reaches a security-sensitive operation
      - validation or fixed-format constraints applied after the read
    verify:
      - distinguish user-controlled files from packaged or administrator-only configuration
      - confirm influence on the relevant sink rather than treating the read alone as a vulnerability
    exclude:
      - do not claim attacker control solely because std fs reads the file
  provenance:
    note: Content returned by exact std fs read functions is external input; path control is separately represented by filesystem sink evidence.
    references:
      - https://cwe.mitre.org/data/definitions/20.html
      - https://doc.rust-lang.org/std/fs/fn.read_to_string.html

