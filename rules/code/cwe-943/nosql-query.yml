- id: javascript-mongodb-where-query
  version: 1
  title: MongoDB JavaScript where predicate
  language: javascript
  kind: sink
  capability: database_query
  confidence: high
  cwe: [CWE-943]
  match: &mongodb_where_match
    any:
      - pattern: '$COLLECTION.find({ $where: $QUERY, $$$REST })'
        captures: { nosql_query: QUERY }
      - pattern: '$COLLECTION.find({ $where: $QUERY })'
        captures: { nosql_query: QUERY }
  tags: [database, mongodb, nosql, where-javascript]
  ai: &mongodb_where_guidance
    investigate:
      - whether request-derived values are concatenated into the executable MongoDB where predicate
      - whether the query can use ordinary typed MongoDB selectors instead of server-side JavaScript
    verify:
      - confirm the receiver is a MongoDB collection and the captured value reaches the where property
  provenance: &mongodb_where_provenance
    note: MongoDB where predicates execute JavaScript and are unsafe when composed from request data.
    references:
      - https://cwe.mitre.org/data/definitions/943.html

