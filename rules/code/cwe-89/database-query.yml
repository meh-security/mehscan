- id: csharp-database-query
  version: 1
  title: .NET database query construction and execution
  language: csharp
  kind: sink
  capability: database_query
  cwe: [CWE-89]
  match:
    any:
      - pattern: new SqlCommand($QUERY)
        captures: { query: QUERY }
      - pattern: new SqlCommand($QUERY, $$$ARGUMENTS)
        captures: { query: QUERY }
      - pattern: $DATABASE.ExecuteSqlRaw($QUERY)
        captures: { query: QUERY }
      - pattern: $DATABASE.ExecuteSqlRaw($QUERY, $$$ARGUMENTS)
        captures: { query: QUERY }
      - pattern: $DATABASE.FromSqlRaw($QUERY)
        captures: { query: QUERY }
      - pattern: $DATABASE.FromSqlRaw($QUERY, $$$ARGUMENTS)
        captures: { query: QUERY }
  tags: [database, sql]
  ai: &database_guidance
    investigate:
      - origin and construction of the query text
      - parameter binding versus string interpolation or concatenation
      - authorization and tenant constraints around the queried data
  provenance:
    note: .NET SQL command APIs mapped to the CWE-89 investigation surface.
    references:
      - https://cwe.mitre.org/data/definitions/89.html
      - https://learn.microsoft.com/en-us/dotnet/api/system.data.sqlclient.sqlcommand

