      - pattern: new NpgsqlDataAdapter($QUERY, $$$ARGUMENTS)
        captures: { query: QUERY }
      - pattern: new MySqlDataAdapter($QUERY, $$$ARGUMENTS)
        captures: { query: QUERY }
      - pattern: new SQLiteDataAdapter($QUERY, $$$ARGUMENTS)
        captures: { query: QUERY }
      - pattern: new OracleDataAdapter($QUERY, $$$ARGUMENTS)
        captures: { query: QUERY }
      - pattern: new OdbcDataAdapter($QUERY, $$$ARGUMENTS)
        captures: { query: QUERY }
      - pattern: new OleDbDataAdapter($QUERY, $$$ARGUMENTS)
