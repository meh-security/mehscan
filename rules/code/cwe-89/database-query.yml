- id: go-database-query
  version: 1
  title: Go database query execution
  language: go
  kind: sink
  capability: database_query
  cwe: [CWE-89]
  match:
    any:
      - pattern: $DB.Query($QUERY)
        context: |
          package pattern
          func patternContext() { $DB.Query($QUERY) }
        selector: call_expression
        captures: { query: QUERY }
      - pattern: $DB.Query($QUERY, $$$ARGUMENTS)
        captures: { query: QUERY }
      - pattern: $DB.QueryContext($CONTEXT, $QUERY, $$$ARGUMENTS)
        captures: { query: QUERY, context: CONTEXT }
      - pattern: $DB.Exec($QUERY)
        context: |
          package pattern
          func patternContext() { $DB.Exec($QUERY) }
        selector: call_expression
        captures: { query: QUERY }
      - pattern: $DB.Exec($QUERY, $$$ARGUMENTS)
        captures: { query: QUERY }
      - pattern: $DB.ExecContext($CONTEXT, $QUERY, $$$ARGUMENTS)
        captures: { query: QUERY, context: CONTEXT }
  tags: [database, sql]
  ai: *database_guidance
  provenance:
    note: Go database/sql query APIs mapped to the CWE-89 investigation surface.
    references:
      - https://cwe.mitre.org/data/definitions/89.html
      - https://pkg.go.dev/database/sql

