- id: c-client-database-query
  version: 1
  title: C PostgreSQL, MySQL and ODBC query text entrypoints
  language: c
  kind: sink
  capability: database_query
  cwe: [CWE-89]
  match: &native_client_database_match
    any:
      - pattern: PQexec($DATABASE, $QUERY)
        context: void pattern_context() { PQexec($DATABASE, $QUERY); }
        selector: call_expression
        captures: { database: DATABASE, query: QUERY }
      - pattern: PQexecParams($DATABASE, $QUERY, $$$ARGUMENTS)
        context: void pattern_context() { PQexecParams($DATABASE, $QUERY, $$$ARGUMENTS); }
        selector: call_expression
        captures: { database: DATABASE, query: QUERY }
      - pattern: PQprepare($DATABASE, $NAME, $QUERY, $$$ARGUMENTS)
        context: void pattern_context() { PQprepare($DATABASE, $NAME, $QUERY, $$$ARGUMENTS); }
        selector: call_expression
        captures: { database: DATABASE, query: QUERY }
      - pattern: mysql_query($DATABASE, $QUERY)
        context: void pattern_context() { mysql_query($DATABASE, $QUERY); }
        selector: call_expression
        captures: { database: DATABASE, query: QUERY }
      - pattern: mysql_real_query($DATABASE, $QUERY, $LENGTH)
        context: void pattern_context() { mysql_real_query($DATABASE, $QUERY, $LENGTH); }
        selector: call_expression
        captures: { database: DATABASE, query: QUERY }
      - pattern: mysql_stmt_prepare($STATEMENT, $QUERY, $LENGTH)
        context: void pattern_context() { mysql_stmt_prepare($STATEMENT, $QUERY, $LENGTH); }
        selector: call_expression
        captures: { query: QUERY }
      - pattern: SQLExecDirect($STATEMENT, $QUERY, $LENGTH)
        context: void pattern_context() { SQLExecDirect($STATEMENT, $QUERY, $LENGTH); }
        selector: call_expression
        captures: { query: QUERY }
      - pattern: SQLExecDirectA($STATEMENT, $QUERY, $LENGTH)
        context: void pattern_context() { SQLExecDirectA($STATEMENT, $QUERY, $LENGTH); }
        selector: call_expression
        captures: { query: QUERY }
      - pattern: SQLExecDirectW($STATEMENT, $QUERY, $LENGTH)
        context: void pattern_context() { SQLExecDirectW($STATEMENT, $QUERY, $LENGTH); }
        selector: call_expression
        captures: { query: QUERY }
      - pattern: SQLPrepare($STATEMENT, $QUERY, $LENGTH)
        context: void pattern_context() { SQLPrepare($STATEMENT, $QUERY, $LENGTH); }
        selector: call_expression
        captures: { query: QUERY }
      - pattern: SQLPrepareA($STATEMENT, $QUERY, $LENGTH)
        context: void pattern_context() { SQLPrepareA($STATEMENT, $QUERY, $LENGTH); }
        selector: call_expression
        captures: { query: QUERY }
      - pattern: SQLPrepareW($STATEMENT, $QUERY, $LENGTH)
        context: void pattern_context() { SQLPrepareW($STATEMENT, $QUERY, $LENGTH); }
        selector: call_expression
        captures: { query: QUERY }
  tags: [database, sql, native]
  ai: &native_client_database_guidance
    investigate:
      - origin and construction of the SQL text, including dynamic identifiers and clauses
      - separately bound values versus data concatenated into the SQL argument
    verify:
      - confirm the exact client API identity and query-text argument position
      - confirm external data influences SQL syntax rather than only a bound value
    exclude:
      - a constant query, prepared handle, or separately bound values alone are not vulnerability proof
  provenance: &native_client_database_provenance
    note: Query-text positions in PostgreSQL libpq, MySQL C client and ODBC APIs; prepared handles and bound values alone are not query text.
    references:
      - https://www.postgresql.org/docs/current/libpq-exec.html
      - https://dev.mysql.com/doc/c-api/8.4/en/mysql-real-query.html
      - https://learn.microsoft.com/en-us/sql/odbc/reference/syntax/sqlexecdirect-function

