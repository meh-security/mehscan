- id: csharp-sql-parameterization
  version: 1
  title: .NET SQL parameter binding
  language: csharp
  kind: sanitizer
  capability: sql_parameterization
  confidence: medium
  cwe: [CWE-89]
  match:
    any:
      - pattern: $COMMAND.Parameters.AddWithValue($NAME, $VALUE)
        captures: { parameter: NAME, value: VALUE }
      - pattern: new SqlParameter($NAME, $VALUE)
        captures: { parameter: NAME, value: VALUE }
  tags: [database, sql, parameterization, dotnet]
  ai: &parameterization_guidance
    investigate:
      - whether every untrusted value occupies a data placeholder rather than SQL syntax
      - whether placeholder names and counts agree with the associated query
      - dynamic identifiers, clauses, and fragments that parameter binding cannot protect
  provenance:
    note: ADO.NET SQL parameter APIs mapped to independent parameterization evidence.
    references:
      - https://cwe.mitre.org/data/definitions/89.html
      - https://learn.microsoft.com/en-us/dotnet/api/system.data.sqlclient.sqlparametercollection.addwithvalue

- id: java-sql-parameterization
  version: 1
  title: JDBC prepared statement and parameter binding
  language: java
  kind: sanitizer
  capability: sql_parameterization
  confidence: medium
  cwe: [CWE-89]
  match:
    any:
      - pattern: $CONNECTION.prepareStatement($QUERY)
        captures: { query: QUERY }
      - pattern: statement.setString($INDEX, $VALUE)
        captures: { parameter: INDEX, value: VALUE }
      - pattern: statement.setInt($INDEX, $VALUE)
        captures: { parameter: INDEX, value: VALUE }
      - pattern: statement.setLong($INDEX, $VALUE)
        captures: { parameter: INDEX, value: VALUE }
      - pattern: statement.setObject($INDEX, $VALUE)
        captures: { parameter: INDEX, value: VALUE }
      - pattern: preparedStatement.setString($INDEX, $VALUE)
        captures: { parameter: INDEX, value: VALUE }
      - pattern: ps.setString($INDEX, $VALUE)
        captures: { parameter: INDEX, value: VALUE }
      - pattern: pstmt.setString($INDEX, $VALUE)
        captures: { parameter: INDEX, value: VALUE }
  tags: [database, sql, parameterization, jdbc]
  ai: *parameterization_guidance
  provenance:
    note: JDBC prepared statements and value setters mapped to independent parameterization evidence.
    references:
      - https://cwe.mitre.org/data/definitions/89.html
      - https://docs.oracle.com/en/java/javase/25/docs/api/java.sql/java/sql/Connection.html#prepareStatement(java.lang.String)
      - https://docs.oracle.com/en/java/javase/25/docs/api/java.sql/java/sql/PreparedStatement.html

- id: javascript-sql-parameterization
  version: 1
  title: JavaScript database parameter binding
  language: javascript
  kind: sanitizer
  capability: sql_parameterization
  confidence: medium
  cwe: [CWE-89]
  match: &javascript_parameterization_match
    any:
      - pattern: 'sequelize.query($QUERY, { bind: $VALUES, $$$OPTIONS })'
        captures: { query: QUERY, parameters: VALUES }
      - pattern: 'sequelize.query($QUERY, { bind: $VALUES })'
        captures: { query: QUERY, parameters: VALUES }
      - pattern: '$DATABASE.sequelize.query($QUERY, { bind: $VALUES, $$$OPTIONS })'
        captures: { database: DATABASE, query: QUERY, parameters: VALUES }
      - pattern: '$DATABASE.sequelize.query($QUERY, { bind: $VALUES })'
        captures: { database: DATABASE, query: QUERY, parameters: VALUES }
      - pattern: 'sequelize.query($QUERY, { replacements: $VALUES, $$$OPTIONS })'
        captures: { query: QUERY, parameters: VALUES }
      - pattern: 'sequelize.query($QUERY, { replacements: $VALUES })'
        captures: { query: QUERY, parameters: VALUES }
      - pattern: '$DATABASE.sequelize.query($QUERY, { replacements: $VALUES, $$$OPTIONS })'
        captures: { database: DATABASE, query: QUERY, parameters: VALUES }
      - pattern: '$DATABASE.sequelize.query($QUERY, { replacements: $VALUES })'
        captures: { database: DATABASE, query: QUERY, parameters: VALUES }
      - pattern: pool.query($QUERY, $VALUES)
        captures: { query: QUERY, parameters: VALUES }
      - pattern: connection.query($QUERY, $VALUES)
        captures: { query: QUERY, parameters: VALUES }
      - pattern: $DATABASE.raw($QUERY, $VALUES)
        captures: { database: DATABASE, query: QUERY, parameters: VALUES }
  tags: [database, sql, parameterization, nodejs, sequelize]
  ai: *parameterization_guidance
  provenance: &javascript_parameterization_provenance
    note: Node database value arrays and Sequelize bind/replacement options mapped to independent parameterization evidence.
    references:
      - https://cwe.mitre.org/data/definitions/89.html
      - https://sequelize.org/docs/v6/core-concepts/raw-queries/#replacements
      - https://node-postgres.com/features/queries

