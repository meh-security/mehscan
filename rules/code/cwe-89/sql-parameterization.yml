- id: go-sql-parameterization
  version: 1
  title: Go database/sql parameter binding
  language: go
  kind: sanitizer
  capability: sql_parameterization
  confidence: medium
  cwe: [CWE-89]
  match:
    any:
      - pattern: $DB.Query($QUERY, $VALUE)
        context: |
          package pattern
          func patternContext() { $DB.Query($QUERY, $VALUE) }
        selector: call_expression
        captures: { query: QUERY, parameter: VALUE }
      - pattern: $DB.Query($QUERY, $VALUE, $$$VALUES)
        captures: { query: QUERY, parameter: VALUE }
      - pattern: $DB.QueryContext($CONTEXT, $QUERY, $VALUE)
        context: |
          package pattern
          func patternContext() { $DB.QueryContext($CONTEXT, $QUERY, $VALUE) }
        selector: call_expression
        captures: { query: QUERY, parameter: VALUE }
      - pattern: $DB.QueryContext($CONTEXT, $QUERY, $VALUE, $$$VALUES)
        captures: { query: QUERY, parameter: VALUE }
      - pattern: $DB.QueryRow($QUERY, $VALUE)
        context: |
          package pattern
          func patternContext() { $DB.QueryRow($QUERY, $VALUE) }
        selector: call_expression
        captures: { query: QUERY, parameter: VALUE }
      - pattern: $DB.QueryRow($QUERY, $VALUE, $$$VALUES)
        captures: { query: QUERY, parameter: VALUE }
      - pattern: $DB.QueryRowContext($CONTEXT, $QUERY, $VALUE)
        context: |
          package pattern
          func patternContext() { $DB.QueryRowContext($CONTEXT, $QUERY, $VALUE) }
        selector: call_expression
        captures: { query: QUERY, parameter: VALUE }
      - pattern: $DB.QueryRowContext($CONTEXT, $QUERY, $VALUE, $$$VALUES)
        captures: { query: QUERY, parameter: VALUE }
      - pattern: $DB.Exec($QUERY, $VALUE)
        context: |
          package pattern
          func patternContext() { $DB.Exec($QUERY, $VALUE) }
        selector: call_expression
        captures: { query: QUERY, parameter: VALUE }
      - pattern: $DB.Exec($QUERY, $VALUE, $$$VALUES)
        captures: { query: QUERY, parameter: VALUE }
      - pattern: $DB.ExecContext($CONTEXT, $QUERY, $VALUE)
        context: |
          package pattern
          func patternContext() { $DB.ExecContext($CONTEXT, $QUERY, $VALUE) }
        selector: call_expression
        captures: { query: QUERY, parameter: VALUE }
      - pattern: $DB.ExecContext($CONTEXT, $QUERY, $VALUE, $$$VALUES)
        captures: { query: QUERY, parameter: VALUE }
  tags: [database, sql, parameterization, database-sql]
  ai: *parameterization_guidance
  provenance:
    note: Go database/sql query arguments mapped to independent parameterization evidence.
    references:
      - https://cwe.mitre.org/data/definitions/89.html
      - https://go.dev/doc/database/sql-injection

- id: rust-sql-parameterization
  version: 1
  title: Rust SQL placeholder binding
  language: rust
  kind: sanitizer
  capability: sql_parameterization
  confidence: high
  cwe: [CWE-89]
  match:
    any:
      - pattern: $QUERY_FUNCTION($QUERY).bind($VALUE)
        captures: { query: QUERY, parameter: VALUE }
      - pattern: $QUERY_FUNCTION($QUERY).bind::<$TYPE, $INFERRED>($VALUE)
        captures: { query: QUERY, parameter: VALUE }
      - pattern: $DATABASE.query($QUERY, $PARAMETERS)
        captures: { query: QUERY, parameter: PARAMETERS }
      - pattern: $DATABASE.query_one($QUERY, $PARAMETERS)
        captures: { query: QUERY, parameter: PARAMETERS }
      - pattern: $DATABASE.query_opt($QUERY, $PARAMETERS)
        captures: { query: QUERY, parameter: PARAMETERS }
      - pattern: $DATABASE.execute($QUERY, $PARAMETERS)
        captures: { query: QUERY, parameter: PARAMETERS }
  tags: [database, sql, parameterization, rust]
  ai: *parameterization_guidance
  provenance:
    note: Placeholder-aware binding on exact Rust database APIs; a bind call without a placeholder is deliberately not treated as protection.
    references:
      - https://docs.rs/sqlx/latest/sqlx/fn.query.html
      - https://docs.rs/diesel/latest/diesel/query_builder/struct.SqlQuery.html
      - https://docs.rs/postgres/latest/postgres/struct.Client.html
