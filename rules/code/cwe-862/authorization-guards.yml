- id: python-permission-required-authorization
  version: 1
  title: Django permission-required authorization guard
  language: python
  kind: guard
  capability: authorization
  cwe: [CWE-862]
  match:
    any:
      - pattern: '@permission_required($POLICY)'
        context: |
          @permission_required($POLICY)
          def pattern_context(): pass
        selector: decorator
        captures: { policy: POLICY }
      - pattern: '@permission_classes($POLICY)'
        context: |
          @permission_classes($POLICY)
          def pattern_context(): pass
        selector: decorator
        captures: { policy: POLICY }
  tags: [http, authorization, django, permission]
  ai: *authorization_guidance
  provenance:
    note: Django permission_required decorators mapped to CWE-862 review.
    references:
      - https://cwe.mitre.org/data/definitions/862.html
      - https://docs.djangoproject.com/en/5.2/topics/auth/default/#the-permission-required-decorator

- id: go-casbin-authorization
  version: 1
  title: Go Casbin authorization decision
  language: go
  kind: guard
  capability: authorization
  cwe: [CWE-862]
  match:
    any:
      - pattern: enforcer.Enforce($SUBJECT, $RESOURCE, $ACTION)
        context: |
          package pattern
          func patternContext() { enforcer.Enforce($SUBJECT, $RESOURCE, $ACTION) }
        selector: call_expression
        captures: { subject: SUBJECT, resource: RESOURCE, permission: ACTION }
  tags: [http, authorization, casbin, policy]
  ai: *authorization_guidance
  provenance:
    note: Casbin policy-enforcement decisions mapped to CWE-862 review.
    references:
      - https://cwe.mitre.org/data/definitions/862.html
      - https://pkg.go.dev/github.com/casbin/casbin/v2#Enforcer.Enforce
