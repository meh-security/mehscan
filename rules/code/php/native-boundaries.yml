- id: php-http-request-data
  version: 1
  title: HTTP request superglobal read
  language: php
  kind: source
  capability: http_request_data
  cwe:
  - CWE-20
  match:
    any:
    - pattern: $SOURCE[$KEY]
      context: <?php $SOURCE[$KEY];
      selector: subscript_expression
      captures:
        field: KEY
  tags:
  - php
  ai:
    investigate:
    - Identify the exact request field, lexical scope, reassignment, and consumer boundary.
    verify:
    - Verify the exact anchor, applicable control, and effective runtime/output context before choosing
      a verdict.
    exclude:
    - Comments, literals, local API lookalikes, unrelated controls, and nonproduction material are not
      vulnerability proof.
  provenance:
    note: Native PHP syntax with canonical callable or locally proven PDO identity; bounded source review
      only.
    references:
    - https://www.php.net/manual/en/security.php
    - https://cwe.mitre.org/data/definitions/20.html
- id: php-command-execution
  version: 1
  title: PHP shell command execution
  language: php
  kind: sink
  capability: process_execution
  cwe:
  - CWE-78
  match:
    any:
    - pattern: $FUNCTION($COMMAND)
      context: <?php $FUNCTION($COMMAND);
      selector: function_call_expression
      captures: &id001
        command: COMMAND
    - pattern: $FUNCTION($COMMAND, $$$REST)
      context: <?php $FUNCTION($COMMAND, $$$REST);
      selector: function_call_expression
      captures: *id001
  tags:
  - php
  - shell
  - command
  ai:
    investigate:
    - Confirm the command argument's origin, shell interpretation, and any exact argument allowlist.
    verify:
    - Verify the exact anchor, applicable control, and effective runtime/output context before choosing
      a verdict.
    exclude:
    - Comments, literals, local API lookalikes, unrelated controls, and nonproduction material are not
      vulnerability proof.
  provenance:
    note: Native PHP syntax with canonical callable or locally proven PDO identity; bounded source review
      only.
    references:
    - https://www.php.net/manual/en/security.php
    - https://cwe.mitre.org/data/definitions/78.html
- id: php-mysqli-query
  version: 1
  title: mysqli SQL query
  language: php
  kind: sink
  capability: database_query
  cwe:
  - CWE-89
  match:
    any:
    - pattern: $FUNCTION($CONNECTION, $QUERY)
      context: <?php $FUNCTION($CONNECTION, $QUERY);
      selector: function_call_expression
      captures: &id002
        query: QUERY
    - pattern: $FUNCTION($CONNECTION, $QUERY, $$$REST)
      context: <?php $FUNCTION($CONNECTION, $QUERY, $$$REST);
      selector: function_call_expression
      captures: *id002
  tags:
  - php
  - sql
  ai:
    investigate:
    - Check whether request values enter SQL syntax rather than separately bound driver parameters.
    verify:
    - Verify the exact anchor, applicable control, and effective runtime/output context before choosing
      a verdict.
    exclude:
    - Comments, literals, local API lookalikes, unrelated controls, and nonproduction material are not
      vulnerability proof.
  provenance:
    note: Native PHP syntax with canonical callable or locally proven PDO identity; bounded source review
      only.
    references:
    - https://www.php.net/manual/en/security.php
    - https://cwe.mitre.org/data/definitions/89.html
- id: php-pdo-query
  version: 1
  title: PDO SQL query or preparation
  language: php
  kind: sink
  capability: database_query
  cwe:
  - CWE-89
  match:
    any:
    - pattern: $DATABASE->$METHOD($QUERY)
      context: <?php $DATABASE->$METHOD($QUERY);
      selector: member_call_expression
      captures: &id003
        query: QUERY
    - pattern: $DATABASE->$METHOD($QUERY, $$$REST)
      context: <?php $DATABASE->$METHOD($QUERY, $$$REST);
      selector: member_call_expression
      captures: *id003
  tags:
  - php
  - sql
  - pdo
  ai:
    investigate:
    - Verify the exact PDO receiver and SQL construction. Preparing interpolated SQL does not protect
      it.
    verify:
    - Verify the exact anchor, applicable control, and effective runtime/output context before choosing
      a verdict.
    exclude:
    - Comments, literals, local API lookalikes, unrelated controls, and nonproduction material are not
      vulnerability proof.
  provenance:
    note: Native PHP syntax with canonical callable or locally proven PDO identity; bounded source review
      only.
    references:
    - https://www.php.net/manual/en/security.php
    - https://cwe.mitre.org/data/definitions/89.html
