    - pattern: $FUNCTION($VALUE, $RAW)
      context: <?php $FUNCTION($VALUE, $RAW);
      selector: function_call_expression
      captures: {algorithm: FUNCTION, value: VALUE}
  tags: [php, cryptography, hash, algorithm-selection]
