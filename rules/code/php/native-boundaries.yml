- id: php-http-request-data
  version: 1
  title: HTTP request superglobal read
  language: php
  kind: source
  capability: http_request_data
  cwe:
  - CWE-20
  match:
    any:
    - pattern: $SOURCE[$KEY]
      context: <?php $SOURCE[$KEY];
      selector: subscript_expression
      captures:
        field: KEY
  tags:
  - php
  ai:
    investigate:
    - Identify the exact request field, lexical scope, reassignment, and consumer boundary.
    verify:
    - Verify the exact anchor, applicable control, and effective runtime/output context before choosing
      a verdict.
    exclude:
    - Comments, literals, local API lookalikes, unrelated controls, and nonproduction material are not
      vulnerability proof.
  provenance:
    note: Native PHP syntax with canonical callable or locally proven PDO identity; bounded source review
      only.
    references:
    - https://www.php.net/manual/en/security.php
    - https://cwe.mitre.org/data/definitions/20.html
- id: php-http-json-field
  version: 1
  title: Native PHP JSON request-body field
  language: php
  kind: source
  capability: http_request_data
  cwe: [CWE-20]
  match:
    any:
    - pattern: $SOURCE[$KEY]
      context: <?php $SOURCE[$KEY];
      selector: subscript_expression
      captures: {field: KEY}
  tags: [php, request, json]
  ai:
    investigate:
    - Inspect the exact native associative JSON-body producer and field consumer; decoding is not validation.
    verify:
    - Confirm the same owner and value and any operation-specific control.
    exclude:
    - Local JSON files, replaced arrays, helper-mutated arrays and unknown callable identities are outside this source contract.
  provenance:
    note: Unique same-owner native json_decode(file_get_contents('php://input'), true) producer, without intervening replacement or helper mutation.
    references:
    - https://www.php.net/manual/en/wrappers.php.php
    - https://www.php.net/manual/en/function.json-decode.php
- id: php-http-json-property
  version: 1
  title: Native PHP JSON request-body property
  language: php
  kind: source
  capability: http_request_data
  cwe: [CWE-20]
  match:
    any:
    - pattern: $SOURCE->$FIELD
      context: <?php $SOURCE->$FIELD;
      selector: member_access_expression
      captures: {field: FIELD}
  tags: [php, request, json]
  ai:
    investigate:
    - Inspect the native object-mode JSON-body producer and exact static property consumer; decoding is not validation.
    verify:
    - Confirm the same owner and value and any operation-specific control.
    exclude:
    - Other object identities, associative-array mode, dynamic properties, replaced values and unknown body readers are outside this source contract.
  provenance:
    note: Unique same-owner native object-mode json_decode of php://input, directly or through one unmutated raw-body binding; no intervening replacement or helper mutation.
    references:
    - https://www.php.net/manual/en/function.json-decode.php
    - https://www.php.net/manual/en/wrappers.php.php
