- id: csharp-hash-algorithm-selection
  version: 1
  title: .NET hash algorithm selection
  language: csharp
  kind: security_configuration
  capability: cryptographic_hash
  cwe: [CWE-327]
  match:
    any:
      - pattern: HashAlgorithm.Create($ALGORITHM)
        captures: { algorithm: ALGORITHM }
  symbols:
    - canonical: System.Security.Cryptography.HashAlgorithm.Create
      captures: { algorithm: 0 }
  tags: [cryptography, hash, algorithm-selection]
  ai: &hash_guidance
    investigate:
      - the selected algorithm and the security purpose of the digest
      - whether collision resistance, password hashing, signatures, or integrity are required
      - compatibility constraints and whether a stronger supported construction is available
    verify:
      - resolve the effective algorithm value and the data or security decision protected by the digest
      - confirm whether an attacker can benefit from violating the required collision, preimage, password-cost, signature, or integrity property
    exclude:
      - do not report a weak algorithm used only as a non-security checksum, cache key, or compatibility identifier
      - do not classify dynamic algorithm-selection syntax without resolving a weak effective value and a security-sensitive purpose
  provenance:
    note: .NET name-based hash selection mapped to CWE-327 review.
    references:
      - https://cwe.mitre.org/data/definitions/327.html
      - https://learn.microsoft.com/en-us/dotnet/api/system.security.cryptography.hashalgorithm.create

