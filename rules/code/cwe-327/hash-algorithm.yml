- id: go-hash-algorithm-selection
  version: 1
  title: Go keyed-hash algorithm selection
  language: go
  kind: security_configuration
  capability: cryptographic_hash
  cwe: [CWE-327]
  match:
    any:
      - pattern: hmac.New($ALGORITHM, $KEY)
        context: |
          package pattern
          func patternContext() { hmac.New($ALGORITHM, $KEY) }
        selector: call_expression
        captures: { algorithm: ALGORITHM }
  symbols:
    - canonical: crypto/hmac.New
      captures: { algorithm: 0 }
  tags: [cryptography, hash, algorithm-selection]
  ai: *hash_guidance
  provenance:
    note: Go HMAC hash-constructor selection mapped to CWE-327 review.
    references:
      - https://cwe.mitre.org/data/definitions/327.html
      - https://pkg.go.dev/crypto/hmac#New

- id: c-openssl-hash-selection
  version: 1
  title: C OpenSSL hash algorithm selection
  language: c
  kind: security_configuration
  capability: cryptographic_hash
  cwe: [CWE-327]
  match: &openssl_hash_match
    any:
      - pattern: EVP_get_digestbyname($ALGORITHM)
        context: |
          void pattern_context() { EVP_get_digestbyname($ALGORITHM); }
        selector: call_expression
        captures: { algorithm: ALGORITHM }
      - pattern: EVP_DigestInit_ex($CONTEXT, $ALGORITHM, $ENGINE)
        context: |
          void pattern_context() { EVP_DigestInit_ex($CONTEXT, $ALGORITHM, $ENGINE); }
        selector: call_expression
        captures: { context: CONTEXT, algorithm: ALGORITHM }
  tags: [cryptography, hash, openssl, native]
  ai: &openssl_hash_guidance
    investigate:
      - the effective digest and its security purpose
      - whether collision resistance, password cost, signatures, authentication, or integrity are required
      - provider configuration and compatibility constraints
    verify:
      - resolve the selected EVP digest and the data or security decision it protects
    exclude:
      - do not report a weak digest used only as a non-security checksum or compatibility identifier
      - do not classify dynamic selection without resolving a weak effective digest and sensitive purpose
  provenance: &openssl_hash_provenance
    note: OpenSSL EVP digest selection is mapped to contextual CWE-327 review rather than treating every digest operation as insecure.
    references:
      - https://cwe.mitre.org/data/definitions/327.html
      - https://docs.openssl.org/3.0/man3/EVP_DigestInit/

