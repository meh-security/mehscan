- id: java-extended-ldap-query
  version: 1
  title: Java LDAP search filter
  language: java
  kind: sink
  capability: ldap_query
  confidence: high
  cwe: [CWE-90]
  match: &jvm_ldap_query
    any:
      - pattern: $BOUNDARY.search($BASE, $FILTER, $CONTROLS)
        captures: { boundary: BOUNDARY, base: BASE, filter: FILTER, controls: CONTROLS }
      - pattern: $BOUNDARY.search($BASE, $FILTER, $VALUES, $CONTROLS)
        captures: { boundary: BOUNDARY, base: BASE, filter: FILTER, values: VALUES, controls: CONTROLS }
  tags: [extended-rules, jvm, ldap, query, injection]
  ai: &ldap_query_guidance
    investigate:
      - origin and construction of the captured LDAP filter expression
      - filter-value encoding, distinguished-name context and any placeholder values
      - search base, scope, returned attributes and authorization boundary
    verify:
      - confirm the typed JNDI directory or LDAP context receiver and selected search overload
      - keep the filter expression separate from the object-array values supplied to filter placeholders
    exclude:
      - exclude fixed filters, unrelated search methods and attacker data confined to correctly encoded or separately substituted values
  provenance:
    note: Typed JNDI search overloads add their filter expression to the existing CWE-90 query relationship.
    references:
      - https://cwe.mitre.org/data/definitions/90.html
      - https://docs.oracle.com/en/java/javase/25/docs/api/java.naming/javax/naming/directory/DirContext.html

