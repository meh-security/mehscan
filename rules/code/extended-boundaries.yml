- id: php-extended-ldap-query
  version: 1
  title: PHP LDAP search filter
  language: php
  kind: sink
  capability: ldap_query
  confidence: high
  cwe: [CWE-90]
  match:
    any:
      - pattern: ldap_search($CONNECTION, $BASE, $FILTER)
        context: <?php ldap_search($CONNECTION, $BASE, $FILTER);
        selector: function_call_expression
        captures: { connection: CONNECTION, base: BASE, filter: FILTER }
      - pattern: ldap_search($CONNECTION, $BASE, $FILTER, $$$ARGUMENTS)
        context: <?php ldap_search($CONNECTION, $BASE, $FILTER, $$$ARGUMENTS);
        selector: function_call_expression
        captures: { connection: CONNECTION, base: BASE, filter: FILTER }
      - pattern: ldap_list($CONNECTION, $BASE, $FILTER, $$$ARGUMENTS)
        context: <?php ldap_list($CONNECTION, $BASE, $FILTER, $$$ARGUMENTS);
        selector: function_call_expression
        captures: { connection: CONNECTION, base: BASE, filter: FILTER }
      - pattern: ldap_read($CONNECTION, $BASE, $FILTER, $$$ARGUMENTS)
        context: <?php ldap_read($CONNECTION, $BASE, $FILTER, $$$ARGUMENTS);
        selector: function_call_expression
        captures: { connection: CONNECTION, base: BASE, filter: FILTER }
  tags: [extended-rules, php, ldap, query, injection]
  ai: *ldap_query_guidance
  provenance:
    note: Native PHP LDAP search functions preserve the filter separately from connection, base and attributes.
    references:
      - https://cwe.mitre.org/data/definitions/90.html
      - https://www.php.net/manual/en/function.ldap-search.php

- id: c-extended-ldap-query
  version: 1
  title: Native LDAP search filter
  language: c
  kind: sink
  capability: ldap_query
  confidence: medium
  cwe: [CWE-90]
  match: &native_ldap_query
    any:
      - pattern: ldap_search_s($CONNECTION, $BASE, $SCOPE, $FILTER, $$$ARGUMENTS)
        context: |
          void pattern_context() { ldap_search_s($CONNECTION, $BASE, $SCOPE, $FILTER, $$$ARGUMENTS); }
        selector: call_expression
        captures: { connection: CONNECTION, base: BASE, scope: SCOPE, filter: FILTER }
      - pattern: ldap_search_ext_s($CONNECTION, $BASE, $SCOPE, $FILTER, $$$ARGUMENTS)
        context: |
          void pattern_context() { ldap_search_ext_s($CONNECTION, $BASE, $SCOPE, $FILTER, $$$ARGUMENTS); }
        selector: call_expression
        captures: { connection: CONNECTION, base: BASE, scope: SCOPE, filter: FILTER }
      - pattern: ldap_search_ext($CONNECTION, $BASE, $SCOPE, $FILTER, $$$ARGUMENTS)
        context: |
          void pattern_context() { ldap_search_ext($CONNECTION, $BASE, $SCOPE, $FILTER, $$$ARGUMENTS); }
        selector: call_expression
        captures: { connection: CONNECTION, base: BASE, scope: SCOPE, filter: FILTER }
  tags: [extended-rules, native, ldap, query, injection]
  ai: *ldap_query_guidance
  provenance: &native_ldap_provenance
    note: Native LDAP search APIs preserve the filter operand; header/link identity remains a review fact.
    references:
      - https://cwe.mitre.org/data/definitions/90.html
      - https://www.openldap.org/software/man.cgi?query=ldap_search_ext_s

