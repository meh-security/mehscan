- id: java-extended-dynamic-expression
  version: 1
  title: JVM dynamic expression or script evaluation
  language: java
  kind: sink
  capability: dynamic_code_execution
  confidence: high
  cwe: [CWE-94]
  match: &jvm_dynamic_expression
    any:
      - pattern: $BOUNDARY.evaluate($CODE)
        captures: { boundary: BOUNDARY, code: CODE }
      - pattern: $BOUNDARY.parse($CODE)
        captures: { boundary: BOUNDARY, code: CODE }
      - pattern: $BOUNDARY.parseClass($CODE)
        captures: { boundary: BOUNDARY, code: CODE }
      - pattern: $BOUNDARY.parseExpression($CODE)
        captures: { boundary: BOUNDARY, code: CODE }
      - pattern: $BOUNDARY.createValueExpression($CONTEXT, $CODE, $TYPE)
        captures: { boundary: BOUNDARY, context: CONTEXT, code: CODE, type: TYPE }
      - pattern: $BOUNDARY.createMethodExpression($CONTEXT, $CODE, $TYPE, $PARAMETERS)
        captures: { boundary: BOUNDARY, context: CONTEXT, code: CODE, type: TYPE }
  tags: [extended-rules, jvm, expression, script, dynamic-code]
  ai: &dynamic_expression_guidance
    investigate:
      - origin and allowed grammar of the captured script or expression
      - objects, methods, classes and host capabilities exposed to evaluation
      - authorization, isolation, resource limits and output handling
    verify:
      - confirm the typed Groovy, Spring Expression Language or Jakarta/Javax EL receiver and effective evaluation consumer
      - determine whether separately supplied variables remain data rather than expression syntax
    exclude:
      - exclude fixed expressions, unrelated same-name methods and parsers that produce inert data
  provenance:
    note: Typed Groovy, Spring expression and EL boundaries extend the existing JVM dynamic-code surface.
    references:
      - https://cwe.mitre.org/data/definitions/94.html
      - https://docs.groovy-lang.org/latest/html/api/groovy/lang/GroovyShell.html
      - https://docs.spring.io/spring-framework/docs/current/javadoc-api/org/springframework/expression/ExpressionParser.html
      - https://jakarta.ee/specifications/expression-language/6.0/apidocs/jakarta.el/jakarta/el/expressionfactory

