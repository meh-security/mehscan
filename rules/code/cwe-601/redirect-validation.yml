- id: python-redirect-destination-validation
  version: 1
  title: Django redirect destination validation
  language: python
  kind: validation
  capability: redirect_destination_validation
  confidence: medium
  cwe: [CWE-601]
  match:
    any:
      - pattern: url_has_allowed_host_and_scheme($LOCATION, allowed_hosts=$ALLOWED)
        captures: { location: LOCATION, allowlist: ALLOWED }
      - pattern: url_has_allowed_host_and_scheme($LOCATION, allowed_hosts=$ALLOWED, require_https=$REQUIRE_HTTPS)
        captures: { location: LOCATION, allowlist: ALLOWED, require_https: REQUIRE_HTTPS }
  tags: [http, redirect, open-redirect, validation, django, python]
  ai: *redirect_validation_guidance
  provenance:
    note: Django allowed-host and scheme checks mapped to contextual redirect validation evidence.
    references:
      - https://cwe.mitre.org/data/definitions/601.html
      - https://docs.djangoproject.com/en/stable/ref/utils/#django.utils.http.url_has_allowed_host_and_scheme

- id: go-redirect-destination-validation
  version: 1
  title: Go relative redirect validation
  language: go
  kind: validation
  capability: redirect_destination_validation
  confidence: medium
  cwe: [CWE-601]
  match:
    any:
      - pattern: '!$URL.IsAbs()'
        context: |
          package pattern
          func patternContext() { _ = !$URL.IsAbs() }
        selector: unary_expression
        captures: { location: URL }
  tags: [http, redirect, open-redirect, validation, go]
  ai: *redirect_validation_guidance
  provenance:
    note: Go relative-URL checks mapped to contextual redirect validation evidence.
    references:
      - https://cwe.mitre.org/data/definitions/601.html
      - https://pkg.go.dev/net/url#URL.IsAbs
