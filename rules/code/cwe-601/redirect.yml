- id: go-http-redirect
  version: 1
  title: Go HTTP redirect response
  language: go
  kind: sink
  capability: redirect
  cwe: [CWE-601]
  match:
    any:
      - pattern: http.Redirect($WRITER, $REQUEST, $LOCATION, $STATUS)
        context: |
          package pattern
          func patternContext() { http.Redirect($WRITER, $REQUEST, $LOCATION, $STATUS) }
        selector: call_expression
        captures: { location: LOCATION }
  symbols:
    - canonical: net/http.Redirect
      captures: { location: 2 }
  tags: [http, redirect, navigation, go-net-http]
  ai: *redirect_guidance
  provenance:
    note: Go net/http redirects mapped to CWE-601 review.
    references:
      - https://cwe.mitre.org/data/definitions/601.html
      - https://pkg.go.dev/net/http#Redirect

- id: rust-axum-http-redirect
  version: 1
  title: Rust Axum redirect response
  language: rust
  kind: sink
  capability: redirect
  cwe: [CWE-601]
  match:
    any:
      - pattern: Redirect::to($LOCATION)
        captures: { location: LOCATION }
      - pattern: Redirect::temporary($LOCATION)
        captures: { location: LOCATION }
      - pattern: Redirect::permanent($LOCATION)
        captures: { location: LOCATION }
      - pattern: axum::response::Redirect::to($LOCATION)
        captures: { location: LOCATION }
      - pattern: axum::response::Redirect::temporary($LOCATION)
        captures: { location: LOCATION }
      - pattern: axum::response::Redirect::permanent($LOCATION)
        captures: { location: LOCATION }
  tags: [http, redirect, navigation, rust, axum]
  ai: *redirect_guidance
  provenance:
