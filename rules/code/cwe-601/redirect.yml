- id: csharp-http-redirect
  version: 1
  title: ASP.NET Core redirect response
  language: csharp
  kind: sink
  capability: redirect
  cwe: [CWE-601]
  match:
    any:
      - pattern: $RESPONSE.Redirect($LOCATION)
        captures: { location: LOCATION }
      - pattern: Results.Redirect($LOCATION)
        captures: { location: LOCATION }
  tags: [http, redirect, navigation]
  ai: &redirect_guidance
    investigate:
      - provenance and attacker control of the redirect destination
      - scheme, host, path, canonicalization, and allowlist validation
      - trust-boundary changes, authentication flows, and phishing impact
  provenance:
    note: ASP.NET Core redirects mapped to CWE-601 review.
    references:
      - https://cwe.mitre.org/data/definitions/601.html
      - https://learn.microsoft.com/en-us/dotnet/api/microsoft.aspnetcore.http.httpresponse.redirect

- id: csharp-controller-http-redirect
  version: 1
  title: ASP.NET controller URL redirect
  language: csharp
  kind: sink
  capability: redirect
  confidence: medium
  cwe: [CWE-601]
  match:
    any:
      - pattern: Redirect($LOCATION)
        captures: { location: LOCATION }
      - pattern: RedirectPermanent($LOCATION)
        captures: { location: LOCATION }
      - pattern: RedirectPreserveMethod($LOCATION)
        captures: { location: LOCATION }
      - pattern: RedirectPermanentPreserveMethod($LOCATION)
        captures: { location: LOCATION }
  tags: [http, redirect, navigation, aspnet-core, controller]
  ai: *redirect_guidance
  provenance:
    note: ASP.NET ControllerBase URL redirect helpers mapped to CWE-601 review with medium confidence because inherited receiver types are not compiler-resolved.
    references:
      - https://cwe.mitre.org/data/definitions/601.html
      - https://learn.microsoft.com/en-us/dotnet/api/microsoft.aspnetcore.mvc.controllerbase.redirect
      - https://learn.microsoft.com/en-us/dotnet/api/microsoft.aspnetcore.mvc.controllerbase.redirectpermanent

