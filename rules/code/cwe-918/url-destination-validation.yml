- id: csharp-url-destination-validation
  version: 1
  title: .NET URL destination validation
  language: csharp
  kind: validation
  capability: url_destination_validation
  confidence: medium
  cwe: [CWE-918]
  match:
    any:
      - pattern: $URI.Scheme == Uri.UriSchemeHttps
        captures: { endpoint: URI }
      - pattern: Uri.UriSchemeHttps == $URI.Scheme
        captures: { endpoint: URI }
      - pattern: $ALLOWED.Contains($URI.Host)
        captures: { endpoint: URI, allowlist: ALLOWED }
  tags: [http, network, ssrf, url, validation, dotnet]
  ai: &url_validation_guidance
    investigate:
      - whether both scheme and normalized hostname are constrained to intended values
      - exact-host matching rather than suffix or substring confusion
      - private, loopback, link-local, multicast, and cloud metadata addresses
      - DNS resolution and redirect targets after the initial validation
      - whether the checked parsed value is exactly the destination later requested
  provenance:
    note: .NET URI scheme and host-allowlist checks mapped to contextual destination validation evidence.
    references:
      - https://cwe.mitre.org/data/definitions/918.html
      - https://learn.microsoft.com/en-us/dotnet/api/system.uri.scheme
      - https://learn.microsoft.com/en-us/dotnet/api/system.uri.host

