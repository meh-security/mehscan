- id: go-url-destination-validation
  version: 1
  title: Go URL destination validation
  language: go
  kind: validation
  capability: url_destination_validation
  confidence: medium
  cwe: [CWE-918]
  match:
    any:
      - pattern: $URL.Scheme == "https"
        context: |
          package pattern
          func patternContext() { _ = $URL.Scheme == "https" }
        selector: binary_expression
        captures: { endpoint: URL }
      - pattern: $URL.Hostname() == $HOST
        context: |
          package pattern
          func patternContext() { _ = $URL.Hostname() == $HOST }
        selector: binary_expression
        captures: { endpoint: URL, allowed_host: HOST }
  tags: [http, network, ssrf, url, validation, go]
  ai: *url_validation_guidance
  provenance:
    note: Go parsed-URL scheme and hostname checks mapped to contextual destination validation evidence.
    references:
      - https://cwe.mitre.org/data/definitions/918.html
      - https://pkg.go.dev/net/url

- id: rust-url-destination-validation
  version: 1
  title: Rust URL destination validation
  language: rust
  kind: validation
  capability: url_destination_validation
  confidence: medium
  cwe: [CWE-918]
  match:
    any:
      - pattern: $URL.scheme() == "https"
        captures: { endpoint: URL }
      - pattern: '"https" == $URL.scheme()'
        captures: { endpoint: URL }
      - pattern: $ALLOWED.contains(&$URL.host_str())
        captures: { endpoint: URL, allowlist: ALLOWED }
      - pattern: $URL.host_str() == Some($HOST)
        captures: { endpoint: URL, allowed_host: HOST }
  tags: [http, network, ssrf, url, validation, rust]
  ai: *url_validation_guidance
  provenance:
    note: Rust parsed-URL scheme and exact host checks mapped to contextual destination validation evidence.
    references:
      - https://cwe.mitre.org/data/definitions/918.html
      - https://docs.rs/url/latest/url/struct.Url.html
