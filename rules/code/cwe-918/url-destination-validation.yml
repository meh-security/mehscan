- id: javascript-url-destination-validation
  version: 1
  title: JavaScript URL destination validation
  language: javascript
  kind: validation
  capability: url_destination_validation
  confidence: medium
  cwe: [CWE-918]
  match: &javascript_url_validation_match
    any:
      - pattern: '$URL.protocol === "https:"'
        captures: { endpoint: URL }
      - pattern: '"https:" === $URL.protocol'
        captures: { endpoint: URL }
      - pattern: $ALLOWED.includes($URL.hostname)
        captures: { endpoint: URL, allowlist: ALLOWED }
  tags: [http, network, ssrf, url, validation, javascript]
  ai: *url_validation_guidance
  provenance: &javascript_url_validation_provenance
    note: WHATWG URL protocol and hostname-allowlist checks mapped to contextual destination validation evidence.
    references:
      - https://cwe.mitre.org/data/definitions/918.html
      - https://developer.mozilla.org/en-US/docs/Web/API/URL/protocol
      - https://developer.mozilla.org/en-US/docs/Web/API/URL/hostname

