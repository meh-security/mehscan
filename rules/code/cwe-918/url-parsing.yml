- id: go-url-parsing
  version: 1
  title: Go URL parsing
  language: go
  kind: sanitizer
  capability: url_parsing
  confidence: medium
  cwe: [CWE-918]
  match:
    any:
      - pattern: url.Parse($VALUE)
        context: |
          package pattern
          func patternContext() { _, _ = url.Parse($VALUE) }
        selector: call_expression
        captures: { value: VALUE }
      - pattern: url.ParseRequestURI($VALUE)
        context: |
          package pattern
          func patternContext() { _, _ = url.ParseRequestURI($VALUE) }
        selector: call_expression
        captures: { value: VALUE }
  tags: [http, network, ssrf, url, parsing, go]
  ai: *url_parsing_guidance
  provenance:
    note: Go net/url parsing mapped to contextual URL parsing evidence.
    references:
      - https://cwe.mitre.org/data/definitions/918.html
      - https://pkg.go.dev/net/url

