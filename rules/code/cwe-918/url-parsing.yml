- id: csharp-url-parsing
  version: 1
  title: .NET URL parsing
  language: csharp
  kind: sanitizer
  capability: url_parsing
  confidence: medium
  cwe: [CWE-918]
  match:
    any:
      - pattern: new Uri($VALUE)
        captures: { value: VALUE }
      - pattern: new Uri($VALUE, UriKind.Absolute)
        captures: { value: VALUE }
  tags: [http, network, ssrf, url, parsing, dotnet]
  ai: &url_parsing_guidance
    investigate:
      - whether the parsed scheme and hostname are explicitly validated
      - redirects, DNS rebinding, private ranges, loopback, and metadata endpoints
      - userinfo, alternate IP encodings, ports, fragments, and parser differentials
      - whether the parsed value is exactly the destination used by the network API
  provenance:
    note: .NET Uri construction mapped to contextual URL parsing evidence.
    references:
      - https://cwe.mitre.org/data/definitions/918.html
      - https://learn.microsoft.com/en-us/dotnet/api/system.uri

