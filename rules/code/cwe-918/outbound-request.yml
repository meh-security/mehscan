- id: go-outbound-http
  version: 1
  title: Go outbound HTTP request
  language: go
  kind: sink
  capability: outbound_network_request
  cwe: [CWE-918]
  match:
    any:
      - pattern: http.Get($URL)
        context: |
          package pattern
          func patternContext() { http.Get($URL) }
        selector: call_expression
        captures: { endpoint: URL }
      - pattern: http.Post($URL, $CONTENT_TYPE, $BODY)
        captures: { endpoint: URL }
      - pattern: http.NewRequest($METHOD, $URL, $BODY)
        captures: { endpoint: URL, method: METHOD }
      - pattern: http.NewRequestWithContext($CONTEXT, $METHOD, $URL, $BODY)
        captures: { endpoint: URL, method: METHOD, context: CONTEXT }
      - pattern: $CLIENT.Do($REQUEST)
        context: |
          package pattern
          func patternContext() { $CLIENT.Do($REQUEST) }
        selector: call_expression
        captures: { request: REQUEST }
  symbols:
    - canonical: net/http.Get
      captures: { endpoint: 0 }
    - canonical: net/http.Post
      captures: { endpoint: 0 }
    - canonical: net/http.NewRequest
      captures: { method: 0, endpoint: 1 }
    - canonical: net/http.NewRequestWithContext
      captures: { context: 0, method: 1, endpoint: 2 }
  tags: [http, network, ssrf]
  ai: *outbound_guidance
  provenance:
    note: Go net/http client APIs mapped to the CWE-918 investigation surface.
    references:
      - https://cwe.mitre.org/data/definitions/918.html
      - https://pkg.go.dev/net/http

- id: rust-outbound-http
  version: 1
  title: Rust outbound HTTP request
  language: rust
  kind: sink
  capability: outbound_network_request
  cwe: [CWE-918]
  match:
    any:
      - pattern: reqwest::get($URL)
        captures: { endpoint: URL }
      - pattern: reqwest::blocking::get($URL)
        captures: { endpoint: URL }
      - pattern: $REQUEST_FUNCTION($URL)
        captures: { endpoint: URL }
      - pattern: reqwest::Client::new().get($URL)
        captures: { endpoint: URL }
      - pattern: reqwest::Client::new().post($URL)
        captures: { endpoint: URL }
      - pattern: reqwest::Client::new().request($METHOD, $URL)
        captures: { method: METHOD, endpoint: URL }
      - pattern: $CLIENT.get($URL)
        captures: { client: CLIENT, endpoint: URL }
      - pattern: $CLIENT.post($URL)
        captures: { client: CLIENT, endpoint: URL }
      - pattern: $CLIENT.request($METHOD, $URL)
        captures: { client: CLIENT, method: METHOD, endpoint: URL }
  tags: [http, network, ssrf, rust, reqwest]
  ai: *outbound_guidance
  provenance:
    note: Exact Reqwest free functions, inline clients, imported aliases, and locally proven client receivers mapped to outbound destination review.
    references:
      - https://cwe.mitre.org/data/definitions/918.html
      - https://docs.rs/reqwest/latest/reqwest/

- id: c-libcurl-outbound-request
  version: 1
  title: C libcurl outbound destination
  language: c
  kind: sink
  capability: outbound_network_request
  cwe: [CWE-918]
  match: &libcurl_url_match
    any:
      - pattern: curl_easy_setopt($HANDLE, CURLOPT_URL, $URL)
        context: |
          void pattern_context() { curl_easy_setopt($HANDLE, CURLOPT_URL, $URL); }
        selector: call_expression
        captures: { client: HANDLE, endpoint: URL }
  tags: [http, network, ssrf, libcurl, native]
  ai: &libcurl_guidance
    investigate:
      - origin and normalization of the effective URL
      - allowed schemes, redirects, proxies, DNS resolution, and private or link-local destinations
      - libcurl protocol restrictions and deployment network controls
    verify:
      - confirm the configured handle performs the request and retains this URL option
      - distinguish attacker-selected destinations from fixed service endpoints
    exclude:
      - do not claim SSRF from a CURLOPT_URL observation without controllable destination evidence
  provenance: &libcurl_provenance
    note: libcurl CURLOPT_URL configuration is mapped to the shared outbound-destination evidence surface.
    references:
      - https://cwe.mitre.org/data/definitions/918.html
      - https://curl.se/libcurl/c/CURLOPT_URL.html

