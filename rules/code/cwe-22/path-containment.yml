- id: python-path-containment-check
  version: 1
  title: Python base-path containment check
  language: python
  kind: validation
  capability: path_containment_check
  confidence: medium
  cwe: [CWE-22]
  match:
    any:
      - pattern: os.path.commonpath([$BASE, $PATH]) == $BASE
        captures: { path: PATH, base: BASE }
      - pattern: $BASE == os.path.commonpath([$BASE, $PATH])
        captures: { path: PATH, base: BASE }
      - pattern: os.path.commonpath(($BASE, $PATH)) == $BASE
        captures: { path: PATH, base: BASE }
      - pattern: $BASE == os.path.commonpath(($BASE, $PATH))
        captures: { path: PATH, base: BASE }
  tags: [filesystem, path, containment, validation, python]
  ai: *containment_guidance
  provenance:
    note: Python common-path equality checks mapped to contextual base-directory validation evidence.
    references:
      - https://cwe.mitre.org/data/definitions/22.html
      - https://docs.python.org/3/library/os.path.html#os.path.commonpath

- id: go-path-containment-check
  version: 1
  title: Go local-path containment check
  language: go
  kind: validation
  capability: path_containment_check
  confidence: medium
  cwe: [CWE-22]
  match:
    any:
      - pattern: filepath.IsLocal($PATH)
        context: |
          package pattern
          func patternContext() { _ = filepath.IsLocal($PATH) }
        selector: call_expression
        captures: { path: PATH }
  tags: [filesystem, path, containment, validation, go]
  ai: *containment_guidance
  provenance:
    note: Go lexical local-path checks mapped to contextual base-directory validation evidence.
    references:
      - https://cwe.mitre.org/data/definitions/22.html
      - https://pkg.go.dev/path/filepath#IsLocal

