- id: csharp-path-canonicalization
  version: 1
  title: .NET path canonicalization
  language: csharp
  kind: sanitizer
  capability: path_canonicalization
  confidence: medium
  cwe: [CWE-22]
  match:
    any:
      - pattern: Path.GetFullPath($VALUE)
        captures: { value: VALUE }
      - pattern: Path.GetFullPath($VALUE, $BASE)
        captures: { value: VALUE, base: BASE }
      - pattern: System.IO.Path.GetFullPath($VALUE)
        captures: { value: VALUE }
      - pattern: System.IO.Path.GetFullPath($VALUE, $BASE)
        captures: { value: VALUE, base: BASE }
  tags: [filesystem, path, canonicalization, dotnet]
  ai: &canonicalization_guidance
    investigate:
      - whether the canonical result, rather than the original value, reaches the filesystem API
      - whether the canonical result is confined to an intended base directory
      - path-boundary, case-sensitivity, alternate-root, and platform-specific behavior
      - symlink resolution and time-of-check/time-of-use races
  provenance:
    note: .NET absolute path resolution mapped to contextual path protection evidence.
    references:
      - https://cwe.mitre.org/data/definitions/22.html
      - https://learn.microsoft.com/en-us/dotnet/api/system.io.path.getfullpath

- id: java-path-canonicalization
