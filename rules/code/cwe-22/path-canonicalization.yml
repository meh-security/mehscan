    references:
      - https://cwe.mitre.org/data/definitions/22.html
      - https://docs.oracle.com/en/java/javase/25/docs/api/java.base/java/nio/file/Path.html

- id: javascript-path-canonicalization
  version: 1
  title: Node.js path canonicalization
  language: javascript
  kind: sanitizer
  capability: path_canonicalization
  confidence: medium
  cwe: [CWE-22]
  match: &node_path_canonicalization_match
