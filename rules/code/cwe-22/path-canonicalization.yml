- id: go-path-canonicalization
  version: 1
  title: Go path canonicalization
  language: go
  kind: sanitizer
  capability: path_canonicalization
  confidence: medium
  cwe: [CWE-22]
  match:
    any:
      - pattern: filepath.Clean($VALUE)
        context: |
          package pattern
          func patternContext() { _ = filepath.Clean($VALUE) }
        selector: call_expression
        captures: { value: VALUE }
      - pattern: filepath.Abs($VALUE)
        context: |
          package pattern
          func patternContext() { _, _ = filepath.Abs($VALUE) }
        selector: call_expression
        captures: { value: VALUE }
      - pattern: filepath.EvalSymlinks($VALUE)
        context: |
          package pattern
          func patternContext() { _, _ = filepath.EvalSymlinks($VALUE) }
        selector: call_expression
        captures: { value: VALUE }
  tags: [filesystem, path, canonicalization, go]
  ai: *canonicalization_guidance
  provenance:
    note: Go lexical, absolute, and symlink-resolving path APIs mapped to contextual path protection evidence.
    references:
      - https://cwe.mitre.org/data/definitions/22.html
      - https://pkg.go.dev/path/filepath

