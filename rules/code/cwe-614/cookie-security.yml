- id: csharp-cookie-secure-flag
  version: 1
  title: .NET cookie Secure flag configuration
  language: csharp
  kind: security_configuration
  capability: cookie_configuration
  cwe: [CWE-614]
  match:
    any:
      - pattern: $OPTIONS.Cookie.SecurePolicy = $VALUE
        context: |
          class Pattern { void PatternContext() { $OPTIONS.Cookie.SecurePolicy = $VALUE; } }
        selector: assignment_expression
        captures: { secure: VALUE }
  tags: [cookie, secure, configuration]
  ai: &cookie_secure_guidance
    investigate:
      - the evaluated Secure option and whether the cookie can travel over plaintext transport
      - environment-specific overrides, proxy termination, and production defaults
      - the sensitivity and lifetime of the cookie value
    verify:
      - inspect the final browser-visible Set-Cookie header for the affected route and production environment
      - confirm the cookie carries authentication or other sensitive state and can be sent over an untrusted plaintext channel
    exclude:
      - do not report from cookie-option syntax alone when the effective value enables Secure
      - do not assume proxy TLS termination removes the need for Secure; decide from the final browser-visible cookie and reachable external transport
  provenance: &csharp_cookie_provenance
    note: .NET cookie transport-security configuration mapped to CWE-614 review.
    references:
      - https://cwe.mitre.org/data/definitions/614.html
      - https://learn.microsoft.com/en-us/dotnet/api/microsoft.aspnetcore.http.cookiebuilder.securepolicy

- id: csharp-cookie-httponly-flag
  version: 1
  title: .NET cookie HttpOnly flag configuration
  language: csharp
  kind: security_configuration
  capability: cookie_configuration
  cwe: [CWE-1004]
  match:
    any:
      - pattern: $OPTIONS.Cookie.HttpOnly = $VALUE
        context: |
          class Pattern { void PatternContext() { $OPTIONS.Cookie.HttpOnly = $VALUE; } }
        selector: assignment_expression
        captures: { http_only: VALUE }
  tags: [cookie, http-only, configuration]
  ai: &cookie_httponly_guidance
    investigate:
      - the evaluated HttpOnly option and whether browser script access is required
      - environment-specific overrides and framework defaults
      - the sensitivity and lifetime of the cookie value
    verify:
      - inspect the final browser-visible Set-Cookie header for the affected route and production environment
      - confirm the cookie carries authentication or other sensitive state and is readable by browser script
    exclude:
      - do not report from cookie-option syntax alone when the effective value enables HttpOnly
      - do not classify a deliberately script-readable non-sensitive cookie as an authentication-cookie weakness
  provenance:
    note: .NET cookie script-access configuration mapped to CWE-1004 review.
    references:
      - https://cwe.mitre.org/data/definitions/1004.html
      - https://learn.microsoft.com/en-us/dotnet/api/microsoft.aspnetcore.http.cookiebuilder.httponly

