- id: csharp-dynamic-code
  version: 2
  title: .NET dynamic code evaluation
  language: csharp
  kind: sink
  capability: dynamic_code_execution
  cwe: [CWE-94]
  match:
    any:
      - pattern: CSharpScript.EvaluateAsync($CODE)
        captures: { code: CODE }
      - pattern: CSharpScript.EvaluateAsync($CODE, $$$ARGUMENTS)
        captures: { code: CODE }
      - pattern: CSharpScript.EvaluateAsync<$TYPE>($CODE)
        captures: { code: CODE, result_type: TYPE }
      - pattern: CSharpScript.EvaluateAsync<$TYPE>($CODE, $$$ARGUMENTS)
        captures: { code: CODE, result_type: TYPE }
      - pattern: CSharpScript.RunAsync($CODE)
        captures: { code: CODE }
      - pattern: CSharpScript.RunAsync($CODE, $$$ARGUMENTS)
        captures: { code: CODE }
      - pattern: CSharpScript.RunAsync<$TYPE>($CODE)
        captures: { code: CODE, result_type: TYPE }
      - pattern: CSharpScript.RunAsync<$TYPE>($CODE, $$$ARGUMENTS)
        captures: { code: CODE, result_type: TYPE }
      - pattern: Razor.Parse($CODE)
        captures: { code: CODE }
      - pattern: Razor.Parse($CODE, $$$ARGUMENTS)
        captures: { code: CODE }
  symbols:
    - canonical: Microsoft.CodeAnalysis.CSharp.Scripting.CSharpScript.EvaluateAsync
      captures: { code: 0 }
    - canonical: Microsoft.CodeAnalysis.CSharp.Scripting.CSharpScript.RunAsync
      captures: { code: 0 }
    - canonical: RazorEngine.Razor.Parse
      captures: { code: 0 }
    - canonical: RazorEngine.Templating.Razor.Parse
      captures: { code: 0 }
  tags: [code, dynamic-execution]
  ai: &dynamic_code_guidance
    investigate:
      - origin and allowed grammar of the code or script
      - sandbox boundaries and accessible host capabilities
      - authorization, isolation, resource limits, and error disclosure
  provenance:
    note: Roslyn scripting APIs mapped to the CWE-94 investigation surface.
    references:
      - https://cwe.mitre.org/data/definitions/94.html
      - https://learn.microsoft.com/en-us/dotnet/csharp/roslyn-sdk/scripting-api-samples

- id: java-dynamic-code
  version: 1
  title: Java script evaluation
  language: java
  kind: sink
  capability: dynamic_code_execution
  cwe: [CWE-94]
  match:
    any:
      - pattern: new ScriptEngineManager().getEngineByName($LANGUAGE).eval($CODE)
        captures: { code: CODE, language: LANGUAGE }
      - pattern: new javax.script.ScriptEngineManager().getEngineByName($LANGUAGE).eval($CODE)
        captures: { code: CODE, language: LANGUAGE }
  tags: [code, dynamic-execution]
  ai: *dynamic_code_guidance
  provenance:
    note: Explicit Java ScriptEngineManager evaluation mapped to the CWE-94 investigation surface.
    references:
      - https://cwe.mitre.org/data/definitions/94.html
      - https://docs.oracle.com/en/java/javase/25/docs/api/java.scripting/javax/script/ScriptEngine.html

- id: javascript-dynamic-code
  version: 1
  title: JavaScript dynamic code evaluation
  language: javascript
  kind: sink
  capability: dynamic_code_execution
  cwe: [CWE-94]
  match: &javascript_dynamic_code_match
    any:
      - pattern: eval($CODE)
        captures: { code: CODE }
      - pattern: Function($CODE)
        captures: { code: CODE }
      - pattern: Function($$$PARAMETERS, $CODE)
        captures: { code: CODE }
      - pattern: new Function($CODE)
        captures: { code: CODE }
      - pattern: new Function($$$PARAMETERS, $CODE)
        captures: { code: CODE }
      - pattern: vm.runInNewContext($CODE)
        captures: { code: CODE }
      - pattern: vm.runInNewContext($CODE, $$$ARGUMENTS)
        captures: { code: CODE }
      - pattern: vm.runInThisContext($CODE)
        captures: { code: CODE }
      - pattern: vm.runInThisContext($CODE, $$$ARGUMENTS)
        captures: { code: CODE }
      - pattern: vm.runInContext($CODE, $$$ARGUMENTS)
        captures: { code: CODE }
      - pattern: vm.compileFunction($CODE, $$$ARGUMENTS)
        captures: { code: CODE }
      - pattern: new vm.Script($CODE)
        captures: { code: CODE }
      - pattern: new vm.Script($CODE, $$$ARGUMENTS)
        captures: { code: CODE }
      - pattern: new vm.SourceTextModule($CODE)
        captures: { code: CODE }
      - pattern: new vm.SourceTextModule($CODE, $$$ARGUMENTS)
        captures: { code: CODE }
  symbols: &javascript_dynamic_code_symbols
    - canonical: eval
      captures: { code: 0 }
    - canonical: Function
      captures: { code: 0 }
    - canonical: vm.runInNewContext
      captures: { code: 0 }
    - canonical: vm.runInThisContext
      captures: { code: 0 }
    - canonical: vm.runInContext
      captures: { code: 0 }
    - canonical: vm.compileFunction
      captures: { code: 0 }
    - canonical: vm.Script
      captures: { code: 0 }
    - canonical: vm.SourceTextModule
      captures: { code: 0 }
  tags: [code, dynamic-execution]
  ai: *dynamic_code_guidance
  provenance: &javascript_dynamic_code_provenance
    note: JavaScript and Node.js evaluation APIs mapped to the CWE-94 investigation surface.
    references:
      - https://cwe.mitre.org/data/definitions/94.html
      - https://nodejs.org/api/vm.html

