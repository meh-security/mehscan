- id: go-dynamic-code
  version: 1
  title: Go dynamic plugin loading
  language: go
  kind: sink
  capability: dynamic_code_execution
  cwe: [CWE-94]
  match:
    any:
      - pattern: plugin.Open($PATH)
        context: |
          package pattern
          func patternContext() { plugin.Open($PATH) }
        selector: call_expression
        captures: { code: PATH }
  symbols:
    - canonical: plugin.Open
      captures: { code: 0 }
  tags: [code, dynamic-execution, plugin]
  ai: *dynamic_code_guidance
  provenance:
    note: Go plugin loading mapped to the CWE-94 investigation surface.
    references:
      - https://cwe.mitre.org/data/definitions/94.html
      - https://pkg.go.dev/plugin
