- id: go-dynamic-code-restriction
  version: 1
  title: Go plugin basename restriction
  language: go
  kind: validation
  capability: dynamic_code_restriction
  confidence: medium
  cwe: [CWE-94]
  match:
    any:
      - pattern: plugin.Open(filepath.Base($PATH))
        context: |
          package pattern
          func patternContext() { plugin.Open(filepath.Base($PATH)) }
        selector: call_expression
        captures: { code: PATH }
  tags: [code, dynamic-execution, plugin, path, restriction, go]
  ai: *restriction_guidance
  provenance:
    note: Basename-only Go plugin selection mapped to contextual path-restriction evidence.
    references:
      - https://cwe.mitre.org/data/definitions/94.html
      - https://pkg.go.dev/plugin
      - https://pkg.go.dev/path/filepath#Base
