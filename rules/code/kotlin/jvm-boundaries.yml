  title: Kotlin OWASP HTML encoding
  language: kotlin
  kind: sanitizer
  capability: html_encoding
  cwe: [CWE-79]
  match:
    any:
      - pattern: $ENCODER.forHtml($VALUE)
        captures: { value: VALUE }
      - pattern: $ENCODER.forHtmlContent($VALUE)
        captures: { value: VALUE }
  tags: [kotlin, jvm, html, encoding]
  ai:
    investigate:
      - Match the encoded operand, consumed return value and actual output context. HTML content encoding does not authorize JavaScript, URL or CSS interpolation.
    exclude:
      - Only the same encoded value in its supported HTML context is protected. Discarded encoder results, another operand and foreign lookalikes do not protect output.
  provenance:
    note: Canonical org.owasp.encoder.Encode static HTML encoding APIs with import aliases and lexical shadow rejection; contextual protection inventory, not compiler propagation.
    references:
      - https://owasp.org/www-project-java-encoder/
      - https://cwe.mitre.org/data/definitions/79.html
