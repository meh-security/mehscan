- id: kotlin-files-write
  version: 1
  title: Kotlin JVM filesystem write
  language: kotlin
  kind: sink
  capability: filesystem_write
  cwe: [CWE-22]
  match:
    any:
      - pattern: java.nio.file.Files.write($PATH, $CONTENT)
        captures: { path: PATH, content: CONTENT }
      - pattern: java.nio.file.Files.writeString($PATH, $CONTENT)
        captures: { path: PATH, content: CONTENT }
      - pattern: $FILES.write($PATH, $CONTENT)
        captures: { path: PATH, content: CONTENT }
      - pattern: $FILES.writeString($PATH, $CONTENT)
        captures: { path: PATH, content: CONTENT }
      - pattern: $FILES.copy($SOURCE, $PATH)
        captures: { source: SOURCE, path: PATH }
      - pattern: $FILES.move($SOURCE, $PATH)
        captures: { source: SOURCE, path: PATH }
      - pattern: $FILES.delete($PATH)
        captures: { path: PATH }
      - pattern: $FILES.deleteIfExists($PATH)
        captures: { path: PATH }
      - pattern: $FILES.createDirectory($PATH)
        captures: { path: PATH }
      - pattern: $FILES.createDirectories($PATH)
        captures: { path: PATH }
  tags: [kotlin, jvm, filesystem]
  ai:
    investigate:
      - Verify canonical Files identity, execution context and the path capture's exact value origin.
      - This CWE-22 candidate concerns selection of the target path. Track path and content arguments separately; request content does not establish attacker-selected path syntax.
    verify:
      - Establish whether the caller can escape the intended target directory through the path argument, accounting for containment and symlink policy.
    exclude:
      - Writing request content to a fixed server-owned path alone is ordinary file-output behavior, not path traversal. Do not infer an authorization or integrity policy violation without supplied evidence of that policy.
  provenance: *filesystem_provenance

