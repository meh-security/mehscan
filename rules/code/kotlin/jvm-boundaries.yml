- id: kotlin-persistence-query
  version: 1
  title: Kotlin persistence query execution
  language: kotlin
  kind: sink
  capability: database_query
  cwe: [CWE-89]
  match:
    any:
      - pattern: $MANAGER.createQuery($QUERY)
        captures: { query: QUERY }
      - pattern: $MANAGER.createQuery($QUERY, $TYPE)
        captures: { query: QUERY }
      - pattern: $MANAGER.createNativeQuery($QUERY)
        captures: { query: QUERY }
      - pattern: $MANAGER.createNativeQuery($QUERY, $TYPE)
        captures: { query: QUERY }
  tags: [kotlin, jvm, sql, persistence]
  ai: *guidance
  provenance:
    note: Exact declared javax/jakarta EntityManager receiver; query boundary alone does not establish attacker control or unsafe construction.
    references:
      - https://cwe.mitre.org/data/definitions/89.html
      - https://jakarta.ee/specifications/persistence/3.2/apidocs/jakarta.persistence/jakarta/persistence/entitymanager
