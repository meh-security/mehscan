- id: kotlin-jdbc-prepare-query
  version: 1
  title: Kotlin JDBC prepared SQL construction
  language: kotlin
  kind: sink
  capability: database_query
  cwe: [CWE-89]
  match:
    any:
      - pattern: $CONNECTION.prepareStatement($QUERY)
        captures: { query: QUERY }
      - pattern: $CONNECTION.prepareStatement($QUERY, $OPTION)
        captures: { query: QUERY }
      - pattern: $CONNECTION.prepareStatement($QUERY, $TYPE, $CONCURRENCY)
        captures: { query: QUERY }
      - pattern: $CONNECTION.prepareStatement($QUERY, $TYPE, $CONCURRENCY, $HOLDABILITY)
        captures: { query: QUERY }
      - pattern: $CONNECTION.prepareCall($QUERY)
        captures: { query: QUERY }
      - pattern: $CONNECTION.prepareCall($QUERY, $TYPE, $CONCURRENCY)
        captures: { query: QUERY }
      - pattern: $CONNECTION.prepareCall($QUERY, $TYPE, $CONCURRENCY, $HOLDABILITY)
        captures: { query: QUERY }
  tags: [kotlin, jvm, sql, jdbc, preparation]
  ai:
    investigate:
      - Request-interpolated SQL construction is a lead; preparation does not sanitize it. For this review's SQL-injection invariant, establish execution of that same prepared statement before claiming query impact.
      - Judge same-statement binding, execution, resets, closure and branches from the supplied containing callable and exact receiver-use facts. Neighboring preparations cannot supply execution or protection.
    verify:
      - Fixed SQL syntax with separately bound request values is data handling. Dynamic SQL followed by same-statement execution is not repaired by a prepareStatement or prepareCall overload.
    exclude:
      - An immediately closed preparation with no supplied execution consumer does not establish executed SQL injection. Dismiss that bounded relationship without recommending dynamic SQL construction or certifying future consumers.
  provenance:
    note: Canonical declared or bounded immutable-local factory java.sql.Connection receiver; preparation does not sanitize SQL already constructed from request text. Establish subsequent execution before claiming runtime query impact.
    references:
      - https://cwe.mitre.org/data/definitions/89.html
      - https://docs.oracle.com/en/java/javase/25/docs/api/java.sql/java/sql/Connection.html

