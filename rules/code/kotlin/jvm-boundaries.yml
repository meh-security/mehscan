- id: kotlin-runtime-exec
  version: 1
  title: Kotlin JVM runtime command execution
  language: kotlin
  kind: sink
  capability: process_execution
  cwe: [CWE-78]
  match:
    any:
      - pattern: java.lang.Runtime.getRuntime().exec($COMMAND)
        captures: { command: COMMAND }
      - pattern: $RUNTIME.getRuntime().exec($COMMAND)
        captures: { command: COMMAND }
  tags: [kotlin, jvm, command]
  ai: &guidance
    investigate:
      - Verify API identity, input origin, execution context and applicable controls.
      - This boundary is a review lead and does not establish attacker control.
      - At canonical Spring MVC mappings, a non-simple unannotated handler parameter normally uses model-attribute request binding. Verify the supplied model property and applicable binder policy; binding=false and another argument resolver can disable that binding.
    verify:
      - Confirm the API resolves to the JVM library and the call executes in production.
      - For digests, verify the selected algorithm and whether the use needs cryptographic strength.
    exclude:
      - Exclude local package lookalikes and inert examples.
      - Exclude strong digest choices and non-security checksums from weak-cryptography findings.
  provenance:
    note: JVM Runtime identity resolved from fully qualified names, imports, aliases or default imports with lexical shadow guards.
    references:
      - https://cwe.mitre.org/data/definitions/78.html
      - https://docs.oracle.com/en/java/javase/25/docs/api/java.base/java/lang/Runtime.html

