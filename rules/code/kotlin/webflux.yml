- id: kotlin-webflux-text-body-source
  version: 1
  title: Kotlin WebFlux reactive text body input
  language: kotlin
  kind: source
  capability: http_request_data
  cwe: [CWE-20]
  match:
    any:
      - pattern: $REQUEST.bodyToMono(String::class.java)
        captures: { value: REQUEST }
      - pattern: $REQUEST.bodyToMono(kotlin.String::class.java)
        captures: { value: REQUEST }
  tags: [kotlin, spring, webflux]
  ai: *webflux-guidance
  provenance: *webflux-provenance
