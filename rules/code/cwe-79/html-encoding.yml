- id: csharp-html-encoding
  version: 1
  title: .NET HTML text encoding
  language: csharp
  kind: sanitizer
  capability: html_encoding
  confidence: medium
  cwe: [CWE-79]
  match:
    any:
      - pattern: HtmlEncoder.Default.Encode($VALUE)
        captures: { value: VALUE }
      - pattern: WebUtility.HtmlEncode($VALUE)
        captures: { value: VALUE }
      - pattern: System.Net.WebUtility.HtmlEncode($VALUE)
        captures: { value: VALUE }
  tags: [html, xss, encoding, dotnet]
  ai: &encoding_guidance
    investigate:
      - the browser output context where the encoded value is inserted
      - whether HTML-text encoding is appropriate for attributes, URLs, JavaScript, or CSS
      - decoding, trusted-markup conversion, or concatenation after encoding
      - template-engine autoescaping and explicit bypasses
  provenance:
    note: .NET HTML text encoders mapped to contextual XSS protection evidence.
    references:
      - https://cwe.mitre.org/data/definitions/79.html
      - https://learn.microsoft.com/en-us/aspnet/core/security/cross-site-scripting

