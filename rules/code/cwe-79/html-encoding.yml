- id: python-html-encoding
  version: 1
  title: Python HTML text encoding
  language: python
  kind: sanitizer
  capability: html_encoding
  confidence: medium
  cwe: [CWE-79]
  match:
    any:
      - pattern: html.escape($VALUE)
        captures: { value: VALUE }
      - pattern: markupsafe.escape($VALUE)
        captures: { value: VALUE }
      - pattern: format_html($FORMAT, $$$VALUE)
        captures: { value: VALUE }
      - pattern: django.utils.html.format_html($FORMAT, $$$VALUE)
        captures: { value: VALUE }
  tags: [html, xss, encoding, python]
  ai: *encoding_guidance
  provenance:
    note: Python HTML escaping APIs mapped to contextual XSS protection evidence.
    references:
      - https://cwe.mitre.org/data/definitions/79.html
      - https://docs.python.org/3/library/html.html#html.escape

- id: go-html-encoding
  version: 1
  title: Go HTML text encoding
  language: go
  kind: sanitizer
  capability: html_encoding
  confidence: medium
  cwe: [CWE-79]
  match:
    any:
      - pattern: html.EscapeString($VALUE)
        context: |
          package pattern
          func patternContext() { _ = html.EscapeString($VALUE) }
        selector: call_expression
        captures: { value: VALUE }
      - pattern: template.HTMLEscapeString($VALUE)
        context: |
          package pattern
          func patternContext() { _ = template.HTMLEscapeString($VALUE) }
        selector: call_expression
        captures: { value: VALUE }
  tags: [html, xss, encoding, go]
  ai: *encoding_guidance
  provenance:
    note: Go HTML escaping functions mapped to contextual XSS protection evidence.
    references:
      - https://cwe.mitre.org/data/definitions/79.html
      - https://pkg.go.dev/html#EscapeString

- id: rust-ammonia-html-sanitization
  version: 1
  title: Rust Ammonia HTML sanitization
  language: rust
  kind: sanitizer
  capability: html_encoding
  confidence: high
  cwe: [CWE-79]
  match:
    any:
      - pattern: $CLEAN($VALUE)
        captures: { value: VALUE }
  tags: [html, xss, sanitization, rust, ammonia]
  ai: *encoding_guidance
  provenance:
    note: Exact ammonia clean calls mapped as HTML-fragment sanitization; context outside an HTML fragment remains a review question.
    references:
      - https://cwe.mitre.org/data/definitions/79.html
      - https://docs.rs/ammonia/latest/ammonia/fn.clean.html
