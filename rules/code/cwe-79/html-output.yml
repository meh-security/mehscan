- id: csharp-html-output
  version: 1
  title: ASP.NET Core response-body output
  language: csharp
  kind: sink
  capability: html_output
  cwe: [CWE-79]
  match:
    any:
      - pattern: $RESPONSE.WriteAsync($HTML)
        captures: { content: HTML }
      - pattern: Results.Content($HTML, "text/html")
        captures: { content: HTML }
  tags: [http, response, html, xss]
  ai: &html_guidance
    investigate:
      - provenance and attacker control of the rendered content
      - output context, encoding, sanitization, and template autoescaping
      - browser interpretation, content type, trusted markup boundaries, and CSP
  provenance:
    note: ASP.NET Core response-body writes mapped to CWE-79 review.
    references:
      - https://cwe.mitre.org/data/definitions/79.html
      - https://learn.microsoft.com/en-us/aspnet/core/fundamentals/use-http-context

