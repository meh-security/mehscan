- id: python-tls-verification
  version: 1
  title: Python TLS verification configuration
  language: python
  kind: security_configuration
  capability: tls_configuration
  cwe: [CWE-295]
  match:
    any:
      - pattern: $CONTEXT.check_hostname = $VALUE
        captures: { verification: VALUE }
      - pattern: $SESSION.verify = $VALUE
        captures: { verification: VALUE }
  tags: [tls, certificate-validation, configuration]
  ai: *tls_guidance
  provenance:
    note: Python hostname and certificate verification options mapped to CWE-295 review.
    references:
      - https://cwe.mitre.org/data/definitions/295.html
      - https://docs.python.org/3/library/ssl.html#ssl.SSLContext.check_hostname

- id: go-tls-insecure-skip-verify
  version: 1
  title: Go TLS peer verification configuration
  language: go
  kind: security_configuration
  capability: tls_configuration
  cwe: [CWE-295]
  match:
    any:
      - pattern: 'tls.Config{InsecureSkipVerify: $VALUE}'
        context: |
          package pattern
          func patternContext() { _ = tls.Config{InsecureSkipVerify: $VALUE} }
        selector: composite_literal
        captures: { verification: VALUE }
  tags: [tls, certificate-validation, configuration]
  ai: *tls_guidance
  provenance:
    note: Go InsecureSkipVerify configuration mapped to CWE-295 review.
    references:
      - https://cwe.mitre.org/data/definitions/295.html
      - https://pkg.go.dev/crypto/tls#Config

- id: rust-reqwest-tls-verification
  version: 1
  title: Rust reqwest TLS peer verification configuration
  language: rust
  kind: security_configuration
  capability: tls_configuration
  cwe: [CWE-295]
  match:
    any:
      - pattern: $CLIENT.danger_accept_invalid_certs($VALUE)
        captures: { client: CLIENT, verification: VALUE }
      - pattern: $CLIENT.danger_accept_invalid_hostnames($VALUE)
        captures: { client: CLIENT, verification: VALUE }
  tags: [tls, certificate-validation, hostname-validation, configuration, rust, reqwest]
  ai: *tls_guidance
  provenance:
    note: Reqwest dangerous certificate and hostname acceptance options mapped to CWE-295 review.
    references:
      - https://cwe.mitre.org/data/definitions/295.html
      - https://docs.rs/reqwest/latest/reqwest/struct.ClientBuilder.html
