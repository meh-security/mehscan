- id: csharp-tls-certificate-validation
  version: 1
  title: .NET TLS certificate validation callback
  language: csharp
  kind: security_configuration
  capability: tls_configuration
  cwe: [CWE-295]
  match:
    any:
      - pattern: $HANDLER.ServerCertificateCustomValidationCallback = ($REQUEST, $CERTIFICATE, $CHAIN, $ERRORS) => $DECISION
        context: |
          class Pattern {
            void PatternContext() {
              $HANDLER.ServerCertificateCustomValidationCallback = ($REQUEST, $CERTIFICATE, $CHAIN, $ERRORS) => $DECISION;
            }
          }
        selector: assignment_expression
        captures: { decision: DECISION }
      - pattern: $HANDLER.ServerCertificateCustomValidationCallback = $CALLBACK
        context: |
          class Pattern {
            void PatternContext() {
              $HANDLER.ServerCertificateCustomValidationCallback = $CALLBACK;
            }
          }
        selector: assignment_expression
        captures: { callback: CALLBACK }
  tags: [tls, certificate-validation, configuration]
  ai: &tls_guidance
    investigate:
      - whether certificate chain and hostname validation can be bypassed
      - the evaluated option or callback behavior and its environment-specific scope
      - compensating trust controls, test-only boundaries, and production reachability
    verify:
      - resolve the effective boolean or callback result on the production client path
      - confirm whether a certificate or hostname that normal validation rejects can be accepted
      - inspect the authoritative runtime client configuration and any environment-specific override
    exclude:
      - do not report from callback or option syntax alone when the evaluated behavior preserves certificate and hostname validation
      - do not treat an explicitly test-only trust override as production exposure without evidence that production can select it
  provenance:
    note: .NET certificate-validation callback configuration mapped to CWE-295 review.
    references:
      - https://cwe.mitre.org/data/definitions/295.html
      - https://learn.microsoft.com/en-us/dotnet/api/system.net.http.httpclienthandler.servercertificatecustomvalidationcallback

- id: java-tls-hostname-verifier
  version: 1
  title: Java TLS hostname verifier configuration
  language: java
  kind: security_configuration
  capability: tls_configuration
  cwe: [CWE-295]
  match:
    any:
      - pattern: $CLIENT.hostnameVerifier(($HOST, $SESSION) -> $DECISION)
        captures: { decision: DECISION }
      - pattern: $CLIENT.hostnameVerifier($VERIFIER)
        captures: { verifier: VERIFIER }
  tags: [tls, hostname-verification, configuration]
  ai: *tls_guidance
  provenance:
    note: Java hostname-verifier configuration mapped to CWE-295 review.
    references:
      - https://cwe.mitre.org/data/definitions/295.html
      - https://docs.oracle.com/en/java/javase/25/docs/api/java.base/javax/net/ssl/HostnameVerifier.html

- id: javascript-tls-reject-unauthorized
  version: 1
  title: Node.js TLS peer verification option
  language: javascript
  kind: security_configuration
  capability: tls_configuration
  cwe: [CWE-295]
  match: &javascript_tls_match
    any:
      - pattern: 'tls.connect({ rejectUnauthorized: $VALUE })'
        captures: { verification: VALUE }
      - pattern: 'https.request({ rejectUnauthorized: $VALUE })'
        captures: { verification: VALUE }
      - pattern: 'new https.Agent({ rejectUnauthorized: $VALUE })'
        captures: { verification: VALUE }
  tags: [tls, certificate-validation, configuration]
  ai: *tls_guidance
  provenance: &javascript_tls_provenance
    note: Node.js rejectUnauthorized options mapped to CWE-295 review.
    references:
      - https://cwe.mitre.org/data/definitions/295.html
      - https://nodejs.org/api/tls.html

