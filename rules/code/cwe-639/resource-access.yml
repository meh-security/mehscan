- id: javascript-sequelize-resource-access
  version: 1
  title: JavaScript structured object resource access
  language: javascript
  kind: sink
  capability: resource_access
  confidence: medium
  cwe: [CWE-639]
  match: &sequelize_resource_access
    any:
      - pattern: '$MODEL.findOne({ where: $FILTER })'
        captures: { model: MODEL, filter: FILTER }
      - pattern: '$MODEL.findOne({ where: $FILTER, $$$OPTIONS })'
        captures: { model: MODEL, filter: FILTER }
      - pattern: '$MODEL.destroy({ where: $FILTER })'
        captures: { model: MODEL, filter: FILTER }
      - pattern: '$MODEL.destroy({ where: $FILTER, $$$OPTIONS })'
        captures: { model: MODEL, filter: FILTER }
  tags: [authorization, idor, object-level-authorization]
  ai: &resource_access_guidance
    investigate:
      - the actual receiver API and application contract; method and option syntax alone does not establish a framework
      - whether a request-selected resource identifier reaches the lookup filter
      - whether the same filter enforces an owner, account, or tenant constraint
      - whether identity constraints come from authenticated server-side context rather than caller-controlled data
      - whether nearby challenge, audit, or telemetry hooks actually block unauthorized access
  provenance: &sequelize_resource_access_provenance
    note: Structured single-resource read and delete syntax mapped to bounded object-level authorization review. The receiver may be an ORM or an application query wrapper; this match does not establish package identity or missing authorization.
    references:
      - https://cwe.mitre.org/data/definitions/639.html
      - https://sequelize.org/docs/v6/core-concepts/model-querying-basics/

