- id: javascript-sequelize-primary-key-resource-access
  version: 1
  title: JavaScript primary-key resource access
  language: javascript
  kind: sink
  capability: resource_access
  confidence: medium
  cwe: [CWE-639]
  match: &primary_key_resource_access
    any:
      - pattern: '$MODEL.findByPk($ID)'
        captures: { model: MODEL, resource_id: ID }
      - pattern: '$MODEL.findByPk($ID, $OPTIONS)'
        captures: { model: MODEL, resource_id: ID, options: OPTIONS }
  tags: &primary_key_resource_tags [authorization, idor, object-level-authorization, sequelize, 'review:source-flow-required']
  ai: *resource_access_guidance
  provenance: &primary_key_resource_provenance
    note: Primary-key lookup syntax is a resource-access lead, not proof of Sequelize identity or missing authorization. Review requires a bounded source-to-key path; unbound occurrences remain inventory evidence. Actor options may preload policy context rather than filter the selected row.
    references:
      - https://sequelize.org/docs/v6/core-concepts/model-querying-finders/
      - https://cwe.mitre.org/data/definitions/639.html

