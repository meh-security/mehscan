- id: javascript-http-entrypoint
  version: 1
  title: Express HTTP route entrypoint
  language: javascript
  kind: entrypoint
  capability: http_request_handling
  cwe: [CWE-306, CWE-862]
  match: &javascript_entrypoint_match
    any:
      - pattern: app.get($ROUTE, $$$HANDLERS)
        captures: { route: ROUTE }
      - pattern: app.post($ROUTE, $$$HANDLERS)
        captures: { route: ROUTE }
      - pattern: app.put($ROUTE, $$$HANDLERS)
        captures: { route: ROUTE }
      - pattern: app.delete($ROUTE, $$$HANDLERS)
        captures: { route: ROUTE }
      - pattern: router.get($ROUTE, $$$HANDLERS)
        captures: { route: ROUTE }
      - pattern: router.post($ROUTE, $$$HANDLERS)
        captures: { route: ROUTE }
      - pattern: router.put($ROUTE, $$$HANDLERS)
        captures: { route: ROUTE }
      - pattern: router.delete($ROUTE, $$$HANDLERS)
        captures: { route: ROUTE }
  tags: [http, entrypoint, express]
  ai: *entrypoint_guidance
  provenance: &javascript_entrypoint_provenance
    note: Express route registration mapped to HTTP entrypoint review.
    references:
      - https://cwe.mitre.org/data/definitions/862.html
      - https://expressjs.com/en/guide/routing.html

- id: javascript-passport-authentication
  version: 1
  title: Passport authentication middleware
  language: javascript
  kind: guard
  capability: authentication
  cwe: [CWE-306]
  match: &javascript_authentication_match
    any:
      - pattern: passport.authenticate($STRATEGY)
        captures: { strategy: STRATEGY }
      - pattern: passport.authenticate($STRATEGY, $$$OPTIONS)
        captures: { strategy: STRATEGY }
  symbols: &javascript_authentication_symbols
    - canonical: passport.authenticate
      captures: { strategy: 0 }
  tags: [http, authentication, passport, middleware]
  ai: *authentication_guidance
  provenance: &javascript_authentication_provenance
    note: Passport authentication middleware mapped to CWE-306 review.
    references:
      - https://cwe.mitre.org/data/definitions/306.html
      - https://www.passportjs.org/concepts/authentication/middleware/

