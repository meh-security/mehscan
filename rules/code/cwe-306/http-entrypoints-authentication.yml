- id: csharp-http-entrypoint
  version: 1
  title: ASP.NET Core minimal API entrypoint
  language: csharp
  kind: entrypoint
  capability: http_request_handling
  cwe: [CWE-306, CWE-862]
  match:
    any:
      - pattern: $APP.MapGet($ROUTE, $HANDLER)
        captures: { route: ROUTE, handler: HANDLER }
      - pattern: $APP.MapPost($ROUTE, $HANDLER)
        captures: { route: ROUTE, handler: HANDLER }
      - pattern: $APP.MapPut($ROUTE, $HANDLER)
        captures: { route: ROUTE, handler: HANDLER }
      - pattern: $APP.MapDelete($ROUTE, $HANDLER)
        captures: { route: ROUTE, handler: HANDLER }
  tags: [http, entrypoint, aspnet-core]
  ai: &entrypoint_guidance
    investigate:
      - request-controlled inputs bound by the route and handler
      - authentication and authorization requirements applied to the endpoint
      - state changes, sensitive resources, validation, and response exposure
  provenance: &csharp_web_provenance
    note: ASP.NET Core minimal API route registration mapped to HTTP entrypoint review.
    references:
      - https://cwe.mitre.org/data/definitions/862.html
      - https://learn.microsoft.com/en-us/aspnet/core/fundamentals/minimal-apis

- id: csharp-authentication-middleware
  version: 1
  title: ASP.NET Core authentication middleware
  language: csharp
  kind: guard
  capability: authentication
  cwe: [CWE-306]
  match:
    any:
      - pattern: $APP.UseAuthentication()
  tags: [http, authentication, aspnet-core, middleware]
  ai: &authentication_guidance
    investigate:
      - the routes and pipeline segment covered by the authentication control
      - configured schemes, credential validation, session handling, and failure behavior
      - ordering, bypass paths, anonymous exceptions, and environment-specific registration
  provenance:
    note: ASP.NET Core authentication middleware mapped to CWE-306 review.
    references:
      - https://cwe.mitre.org/data/definitions/306.html
      - https://learn.microsoft.com/en-us/aspnet/core/fundamentals/middleware/

- id: java-http-entrypoint
  version: 1
  title: Spring HTTP controller entrypoint
  language: java
  kind: entrypoint
  capability: http_request_handling
  cwe: [CWE-306, CWE-862]
  match:
    any:
      - pattern: '@GetMapping($ROUTE)'
        context: |
          class Pattern { @GetMapping($ROUTE) void patternContext() {} }
        selector: annotation
        captures: { route: ROUTE }
      - pattern: '@PostMapping($ROUTE)'
        context: |
          class Pattern { @PostMapping($ROUTE) void patternContext() {} }
        selector: annotation
        captures: { route: ROUTE }
      - pattern: '@RequestMapping($ROUTE)'
        context: |
          class Pattern { @RequestMapping($ROUTE) void patternContext() {} }
        selector: annotation
        captures: { route: ROUTE }
  tags: [http, entrypoint, spring]
  ai: *entrypoint_guidance
  provenance:
    note: Spring MVC mapping annotations mapped to HTTP entrypoint review.
    references:
      - https://cwe.mitre.org/data/definitions/862.html
      - https://docs.spring.io/spring-framework/reference/web/webmvc/mvc-controller/ann-requestmapping.html

