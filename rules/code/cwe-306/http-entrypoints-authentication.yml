- id: python-http-entrypoint
  version: 1
  title: Python HTTP route entrypoint
  language: python
  kind: entrypoint
  capability: http_request_handling
  cwe: [CWE-306, CWE-862]
  match:
    any:
      - pattern: '@app.get($ROUTE)'
        context: |
          @app.get($ROUTE)
          def pattern_context(): pass
        selector: decorator
        captures: { route: ROUTE }
      - pattern: '@app.post($ROUTE)'
        context: |
          @app.post($ROUTE)
          def pattern_context(): pass
        selector: decorator
        captures: { route: ROUTE }
      - pattern: '@router.get($ROUTE)'
        context: |
          @router.get($ROUTE)
          def pattern_context(): pass
        selector: decorator
        captures: { route: ROUTE }
      - pattern: '@router.post($ROUTE)'
        context: |
          @router.post($ROUTE)
          def pattern_context(): pass
        selector: decorator
        captures: { route: ROUTE }
      - pattern: path($ROUTE, $HANDLER)
        captures: { route: ROUTE, handler: HANDLER }
      - pattern: re_path($ROUTE, $HANDLER)
        captures: { route: ROUTE, handler: HANDLER }
      - pattern: '@api_view($METHODS)'
        context: |
          @api_view($METHODS)
          def pattern_context(): pass
        selector: decorator
        captures: { methods: METHODS }
  tags: [http, entrypoint, django, fastapi]
  ai: *entrypoint_guidance
  provenance:
    note: Django and FastAPI route registration mapped to HTTP entrypoint review.
    references:
      - https://cwe.mitre.org/data/definitions/862.html
      - https://fastapi.tiangolo.com/tutorial/path-operation-decorators/

- id: python-login-required-authentication
  version: 1
  title: Django login-required authentication guard
  language: python
  kind: guard
  capability: authentication
  cwe: [CWE-306]
  match:
    any:
      - pattern: '@login_required'
        context: |
          @login_required
          def pattern_context(): pass
        selector: decorator
      - pattern: '@jwt_auth_required'
        context: |
          @jwt_auth_required
          def pattern_context(): pass
        selector: decorator
      - pattern: '@authentication_classes($CLASSES)'
        context: |
          @authentication_classes($CLASSES)
          def pattern_context(): pass
        selector: decorator
        captures: { classes: CLASSES }
  tags: [http, authentication, django, decorator]
  ai: *authentication_guidance
  provenance:
    note: Django login_required decorators mapped to CWE-306 review.
    references:
      - https://cwe.mitre.org/data/definitions/306.html
      - https://docs.djangoproject.com/en/5.2/topics/auth/default/#the-login-required-decorator

- id: go-http-entrypoint
  version: 1
  title: Go net/http entrypoint
  language: go
  kind: entrypoint
  capability: http_request_handling
  cwe: [CWE-306, CWE-862]
  match:
    any:
      - pattern: http.HandleFunc($ROUTE, $HANDLER)
        context: |
          package pattern
          func patternContext() { http.HandleFunc($ROUTE, $HANDLER) }
        selector: call_expression
        captures: { route: ROUTE, handler: HANDLER }
      - pattern: $MUX.HandleFunc($ROUTE, $HANDLER)
        context: |
          package pattern
          func patternContext() { $MUX.HandleFunc($ROUTE, $HANDLER) }
        selector: call_expression
        captures: { route: ROUTE, handler: HANDLER }
  symbols:
    - canonical: net/http.HandleFunc
      captures: { route: 0, handler: 1 }
  tags: [http, entrypoint, go-net-http]
  ai: *entrypoint_guidance
  provenance:
    note: Go net/http handler registration mapped to HTTP entrypoint review.
    references:
      - https://cwe.mitre.org/data/definitions/862.html
      - https://pkg.go.dev/net/http#HandleFunc

