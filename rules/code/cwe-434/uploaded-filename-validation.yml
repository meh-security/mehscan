- id: csharp-uploaded-filename-validation
  version: 1
  title: .NET uploaded basename validation
  language: csharp
  kind: validation
  capability: uploaded_filename_validation
  confidence: medium
  cwe: [CWE-434, CWE-22]
  match:
    any:
      - pattern: Path.GetFileName($VALUE) == $VALUE
        captures: { value: VALUE }
      - pattern: $VALUE == Path.GetFileName($VALUE)
        captures: { value: VALUE }
  tags: [http, upload, filename, validation, basename, dotnet]
  ai: &filename_validation_guidance
    investigate:
      - whether the checked filename is exactly the value used to construct the storage path
      - application-generated names rather than trusting a client-supplied basename
      - extension allowlists, double extensions, trailing dots/spaces, and case behavior
      - content signatures and size limits rather than trusting declared content type
      - destination confinement, overwrite prevention, execution permissions, and malware scanning
  provenance:
    note: .NET basename equality checks mapped to contextual uploaded-filename validation evidence.
    references:
      - https://cwe.mitre.org/data/definitions/434.html
      - https://learn.microsoft.com/en-us/aspnet/core/mvc/models/file-uploads

- id: java-uploaded-filename-validation
  version: 1
  title: Java uploaded basename validation
  language: java
  kind: validation
  capability: uploaded_filename_validation
  confidence: medium
  cwe: [CWE-434, CWE-22]
  match:
    any:
      - pattern: Paths.get($VALUE).getFileName().toString().equals($VALUE)
        captures: { value: VALUE }
      - pattern: $VALUE.equals(Paths.get($VALUE).getFileName().toString())
