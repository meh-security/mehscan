- id: go-uploaded-filename-validation
  version: 1
  title: Go uploaded basename validation
  language: go
  kind: validation
  capability: uploaded_filename_validation
  confidence: medium
  cwe: [CWE-434, CWE-22]
  match:
    any:
      - pattern: filepath.Base($VALUE) == $VALUE
        context: |
          package pattern
          func patternContext() { _ = filepath.Base($VALUE) == $VALUE }
        selector: binary_expression
        captures: { value: VALUE }
      - pattern: $VALUE == filepath.Base($VALUE)
        context: |
          package pattern
          func patternContext() { _ = $VALUE == filepath.Base($VALUE) }
        selector: binary_expression
        captures: { value: VALUE }
  tags: [http, upload, filename, validation, basename, go]
  ai: *filename_validation_guidance
  provenance:
    note: Go basename equality checks mapped to contextual uploaded-filename validation evidence.
    references:
      - https://cwe.mitre.org/data/definitions/434.html
