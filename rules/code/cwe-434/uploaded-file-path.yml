- id: javascript-uploaded-file-path
  version: 1
  title: Multer uploaded filename or temporary path
  language: javascript
  kind: source
  capability: uploaded_file_path
  confidence: medium
  cwe: [CWE-434, CWE-22]
  match: &javascript_uploaded_path_match
    any:
      - pattern: req.file.originalname
      - pattern: req.file.filename
      - pattern: req.file.path
      - pattern: req.files[$INDEX].originalname
        captures: { index: INDEX }
      - pattern: req.files[$INDEX].filename
        captures: { index: INDEX }
      - pattern: req.files[$INDEX].path
        captures: { index: INDEX }
  tags: [http, upload, filename, path, attacker-controlled, multer, javascript]
  ai: *uploaded_path_guidance
  provenance: &javascript_uploaded_path_provenance
    note: Multer original names, storage names, and temporary paths mapped to uploaded-file path evidence.
    references:
      - https://cwe.mitre.org/data/definitions/434.html
      - https://github.com/expressjs/multer#file-information

