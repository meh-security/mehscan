- id: csharp-uploaded-file-path
  version: 1
  title: ASP.NET uploaded filename path
  language: csharp
  kind: source
  capability: uploaded_file_path
  confidence: medium
  cwe: [CWE-434, CWE-22]
  match:
    any:
      - pattern: $REQUEST.Form.Files[$INDEX].FileName
        captures: { request: REQUEST, index: INDEX }
  tags: [http, upload, filename, path, attacker-controlled, dotnet]
  ai: &uploaded_path_guidance
    investigate:
      - whether the client-supplied filename contributes to the persisted path
      - application-generated names, destination roots, traversal, and overwrite behavior
      - extension, content signature, content type, size, and malware validation
      - execution permissions, public serving, archive extraction, and lifecycle cleanup
  provenance:
    note: ASP.NET uploaded filenames mapped to attacker-controlled storage-path evidence.
    references:
      - https://cwe.mitre.org/data/definitions/434.html
      - https://learn.microsoft.com/en-us/aspnet/core/mvc/models/file-uploads

