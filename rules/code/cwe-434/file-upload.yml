- id: go-file-upload-source
  version: 1
  title: Go multipart uploaded-file access
  language: go
  kind: source
  capability: file_upload
  cwe: [CWE-434]
  match:
    any:
      - pattern: $REQUEST.FormFile($FIELD)
        context: |
          package pattern
          func patternContext() { $REQUEST.FormFile($FIELD) }
        selector: call_expression
        captures: { field: FIELD }
  tags: [http, upload, file, request, multipart, go-net-http]
  ai: *upload_guidance
  provenance:
    note: Go multipart FormFile access mapped to CWE-434 review.
    references:
