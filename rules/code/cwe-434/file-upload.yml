- id: csharp-file-upload-source
  version: 1
  title: ASP.NET Core uploaded-file access
  language: csharp
  kind: source
  capability: file_upload
  cwe: [CWE-434]
  match:
    any:
      - pattern: $REQUEST.Form.Files
        context: |
          class Pattern {
            void PatternContext() { var files = $REQUEST.Form.Files; }
          }
        selector: member_access_expression
        captures: { request: REQUEST }
  tags: [http, upload, file, request]
  ai: &upload_guidance
    investigate:
      - attacker control of filename, content type, size, extension, and file contents
      - storage location, canonical path construction, overwrite behavior, and execution exposure
      - validation, malware scanning, authorization, quotas, and lifecycle cleanup
  provenance:
    note: ASP.NET Core uploaded-file access mapped to CWE-434 review.
    references:
      - https://cwe.mitre.org/data/definitions/434.html
      - https://learn.microsoft.com/en-us/dotnet/api/microsoft.aspnetcore.http.iformfile

- id: java-file-upload-source
  version: 1
  title: Java servlet uploaded-file access
  language: java
  kind: source
  capability: file_upload
  cwe: [CWE-434]
  match:
    any:
      - pattern: $REQUEST.getPart($FIELD)
        captures: { field: FIELD }
      - pattern: $REQUEST.getParts()
  tags: [http, upload, file, request, servlet]
  ai: *upload_guidance
  provenance:
    note: Java servlet multipart access mapped to CWE-434 review.
    references:
      - https://cwe.mitre.org/data/definitions/434.html
      - https://jakarta.ee/specifications/servlet/6.1/apidocs/jakarta.servlet/jakarta/servlet/http/httpservletrequest

