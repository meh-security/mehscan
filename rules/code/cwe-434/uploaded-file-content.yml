- id: csharp-uploaded-file-content
  version: 1
  title: ASP.NET uploaded file content
  language: csharp
  kind: source
  capability: uploaded_file_content
  confidence: medium
  cwe: [CWE-434]
  match:
    any:
      - pattern: $REQUEST.Form.Files[$INDEX].OpenReadStream()
        captures: { request: REQUEST, index: INDEX }
  tags: [http, upload, content, attacker-controlled, dotnet]
  ai: &uploaded_content_guidance
    investigate:
      - whether uploaded bytes reach a parser, interpreter, renderer, archive extractor, or storage sink
      - content signature, content type, size, decompression, malware, and parser configuration
      - whether validation is applied to the same bytes before the security-sensitive operation
  provenance:
    note: ASP.NET uploaded streams mapped to attacker-controlled file-content evidence.
    references:
      - https://cwe.mitre.org/data/definitions/434.html
      - https://learn.microsoft.com/en-us/aspnet/core/mvc/models/file-uploads

