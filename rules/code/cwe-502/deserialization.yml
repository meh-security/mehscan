- id: python-pickle-deserialization
  version: 1
  title: Python object deserialization
  language: python
  kind: sink
  capability: deserialization
  cwe: [CWE-502]
  match:
    any:
      - pattern: pickle.load($PAYLOAD)
        captures: { payload: PAYLOAD }
      - pattern: pickle.loads($PAYLOAD)
        captures: { payload: PAYLOAD }
      - pattern: yaml.load($PAYLOAD)
        captures: { payload: PAYLOAD }
      - pattern: yaml.load($PAYLOAD, yaml.Loader)
        captures: { payload: PAYLOAD }
      - pattern: yaml.load($PAYLOAD, Loader=yaml.Loader)
        captures: { payload: PAYLOAD }
      - pattern: yaml.load($PAYLOAD, Loader=yaml.UnsafeLoader)
        captures: { payload: PAYLOAD }
  symbols:
    - canonical: pickle.load
      captures: { payload: 0 }
    - canonical: pickle.loads
      captures: { payload: 0 }
  tags: [deserialization, pickle, unsafe-yaml, object-graph]
  ai: *deserialization_guidance
  provenance:
    note: Python pickle and YAML loading mapped to CWE-502 review.
    references:
      - https://cwe.mitre.org/data/definitions/502.html
      - https://docs.python.org/3/library/pickle.html
      - https://pyyaml.org/wiki/PyYAMLDocumentation

- id: go-gob-deserialization
  version: 1
  title: Go gob value decoding
  language: go
  kind: sink
  capability: deserialization
  cwe: [CWE-502]
  match:
    any:
      - pattern: gob.NewDecoder($PAYLOAD).Decode($TARGET)
        context: |
          package pattern
          func patternContext() { gob.NewDecoder($PAYLOAD).Decode($TARGET) }
        selector: call_expression
        captures: { payload: PAYLOAD, type: TARGET }
  tags: [deserialization, gob, object-graph]
  ai: *deserialization_guidance
  provenance:
    note: Go gob Decode calls mapped to CWE-502 review.
    references:
      - https://cwe.mitre.org/data/definitions/502.html
      - https://pkg.go.dev/encoding/gob#NewDecoder

- id: rust-data-deserialization
  version: 1
  title: Rust data deserialization
  language: rust
  kind: sink
  capability: deserialization
  confidence: medium
  cwe: [CWE-502]
  match:
    any:
      - pattern: serde_json::from_str($PAYLOAD)
        captures: { payload: PAYLOAD }
      - pattern: serde_json::from_slice($PAYLOAD)
        captures: { payload: PAYLOAD }
      - pattern: serde_yaml::from_str($PAYLOAD)
        captures: { payload: PAYLOAD }
      - pattern: toml::from_str($PAYLOAD)
        captures: { payload: PAYLOAD }
      - pattern: bincode::deserialize($PAYLOAD)
        captures: { payload: PAYLOAD }
  tags: [deserialization, rust, structured-data]
  ai: *deserialization_guidance
  provenance:
    note: Rust structured-data decoding is contextual evidence, not an automatic vulnerability; target type, validation, size limits, and custom Deserialize behavior determine impact.
    references:
      - https://cwe.mitre.org/data/definitions/502.html
      - https://docs.rs/serde/latest/serde/trait.Deserialize.html
