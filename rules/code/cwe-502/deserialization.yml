- id: csharp-binary-deserialization
  version: 1
  title: .NET object deserialization
  language: csharp
  kind: sink
  capability: deserialization
  cwe: [CWE-502]
  match:
    any:
      - pattern: new BinaryFormatter().Deserialize($PAYLOAD)
        captures: { payload: PAYLOAD }
  tags: [deserialization, binary, object-graph]
  ai: &deserialization_guidance
    investigate:
      - provenance and attacker control of the serialized payload
      - type restrictions, allowlists, signatures, and integrity boundaries
      - gadget availability and side effects during object construction
  provenance:
    note: BinaryFormatter seed matching; the C# analyzer replaces this observation with exact type identity and project/runtime applicability.
    references:
      - https://cwe.mitre.org/data/definitions/502.html
      - https://learn.microsoft.com/en-us/dotnet/standard/serialization/binaryformatter-security-guide

- id: java-object-deserialization
  version: 1
  title: Java native object read
  language: java
  kind: sink
  capability: deserialization
  cwe: [CWE-502]
  match:
    any:
      - pattern: new ObjectInputStream($INPUT).readObject()
        captures: { payload: INPUT }
      - pattern: $MAPPER.readValue($PAYLOAD, $TYPE)
        captures: { payload: PAYLOAD, type: TYPE }
  tags: [deserialization, java-native, object-graph]
  ai: *deserialization_guidance
  provenance:
    note: Java ObjectInputStream object reads mapped to CWE-502 review.
    references:
      - https://cwe.mitre.org/data/definitions/502.html
      - https://docs.oracle.com/en/java/javase/25/docs/api/java.base/java/io/ObjectInputStream.html
      - https://javadoc.io/doc/com.fasterxml.jackson.core/jackson-databind/latest/com/fasterxml/jackson/databind/ObjectMapper.html

- id: javascript-yaml-deserialization
  version: 1
  title: JavaScript YAML deserialization
  language: javascript
  kind: sink
  capability: deserialization
  cwe: [CWE-502]
  match: &javascript_deserialization_match
    any:
      - pattern: yaml.load($PAYLOAD)
        captures: { payload: PAYLOAD }
      - pattern: 'yaml.load($PAYLOAD, { schema: $SCHEMA })'
        captures: { payload: PAYLOAD, type: SCHEMA }
      - pattern: 'yaml.load($PAYLOAD, { schema: $SCHEMA, $$$OPTIONS })'
        captures: { payload: PAYLOAD, type: SCHEMA }
      - pattern: jsyaml.load($PAYLOAD)
        captures: { payload: PAYLOAD }
      - pattern: 'jsyaml.load($PAYLOAD, { schema: $SCHEMA })'
        captures: { payload: PAYLOAD, type: SCHEMA }
      - pattern: 'jsyaml.load($PAYLOAD, { schema: $SCHEMA, $$$OPTIONS })'
        captures: { payload: PAYLOAD, type: SCHEMA }
  symbols: &javascript_deserialization_symbols
    - canonical: yaml.load
      captures: { payload: 0 }
    - canonical: js-yaml.load
      captures: { payload: 0 }
  tags: [deserialization, yaml, object-graph]
  ai: *deserialization_guidance
  provenance: &javascript_deserialization_provenance
    note: JavaScript YAML loading mapped to CWE-502 review.
    references:
      - https://cwe.mitre.org/data/definitions/502.html
      - https://github.com/nodeca/js-yaml#load-string---options-

