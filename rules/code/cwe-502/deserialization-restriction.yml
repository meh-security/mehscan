- id: java-deserialization-restriction
  version: 1
  title: Java explicit deserialization target type
  language: java
  kind: validation
  capability: deserialization_restriction
  confidence: medium
  cwe: [CWE-502]
  match:
    any:
      - pattern: $MAPPER.readValue($PAYLOAD, $TYPE.class)
        captures: { payload: PAYLOAD, type: TYPE }
  tags: [deserialization, type-restriction, json, java]
  ai: &restriction_guidance
    investigate:
      - whether the captured type is fixed by trusted code rather than attacker-controlled metadata
      - polymorphism, custom converters, callbacks, and object construction side effects
      - size, depth, duplicate-member, and resource-consumption limits
      - whether the exact restricted expression receives the untrusted payload
  provenance:
    note: A Jackson readValue target type mapped to contextual type-restriction evidence.
    references:
      - https://cwe.mitre.org/data/definitions/502.html
      - https://javadoc.io/doc/com.fasterxml.jackson.core/jackson-databind/latest/com/fasterxml/jackson/databind/ObjectMapper.html

- id: javascript-deserialization-restriction
  version: 1
  title: JavaScript YAML schema restriction
  language: javascript
  kind: validation
  capability: deserialization_restriction
  confidence: medium
  cwe: [CWE-502]
  match: &javascript_restriction_match
    any:
      - pattern: 'yaml.load($PAYLOAD, { schema: yaml.JSON_SCHEMA })'
        captures: { payload: PAYLOAD }
      - pattern: 'yaml.load($PAYLOAD, { schema: yaml.FAILSAFE_SCHEMA })'
        captures: { payload: PAYLOAD }
      - pattern: 'jsyaml.load($PAYLOAD, { schema: jsyaml.JSON_SCHEMA })'
        captures: { payload: PAYLOAD }
      - pattern: 'jsyaml.load($PAYLOAD, { schema: jsyaml.FAILSAFE_SCHEMA })'
        captures: { payload: PAYLOAD }
      - pattern: yaml.safeLoad($PAYLOAD)
        captures: { payload: PAYLOAD }
      - pattern: yaml.safeLoad($PAYLOAD, $$$OPTIONS)
        captures: { payload: PAYLOAD }
      - pattern: jsyaml.safeLoad($PAYLOAD)
        captures: { payload: PAYLOAD }
      - pattern: jsyaml.safeLoad($PAYLOAD, $$$OPTIONS)
        captures: { payload: PAYLOAD }
  symbols: &javascript_restriction_symbols
    - canonical: js-yaml.safeLoad
      captures: { payload: 0 }
  tags: [deserialization, schema-restriction, yaml, javascript]
  ai: *restriction_guidance
  provenance: &javascript_restriction_provenance
    note: An explicit js-yaml schema mapped to contextual format and type-restriction evidence.
    references:
      - https://cwe.mitre.org/data/definitions/502.html
      - https://github.com/nodeca/js-yaml#load-string---options-

