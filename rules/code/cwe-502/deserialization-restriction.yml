- id: python-deserialization-restriction
  version: 1
  title: Python safe YAML loader restriction
  language: python
  kind: validation
  capability: deserialization_restriction
  confidence: medium
  cwe: [CWE-502]
  match:
    any:
      - pattern: yaml.safe_load($PAYLOAD)
        captures: { payload: PAYLOAD }
      - pattern: yaml.load($PAYLOAD, Loader=yaml.SafeLoader)
        captures: { payload: PAYLOAD }
  tags: [deserialization, loader-restriction, yaml, python]
  ai: *restriction_guidance
  provenance:
    note: PyYAML safe loader selection mapped to contextual loader-restriction evidence.
    references:
      - https://cwe.mitre.org/data/definitions/502.html
      - https://pyyaml.org/wiki/PyYAMLDocumentation

- id: go-deserialization-restriction
  version: 1
  title: Go explicit JSON destination type
  language: go
  kind: validation
  capability: deserialization_restriction
  confidence: medium
  cwe: [CWE-502]
  match:
    any:
      - pattern: json.Unmarshal($PAYLOAD, &$TYPE{})
        context: |
          package pattern
          func patternContext() { json.Unmarshal($PAYLOAD, &$TYPE{}) }
        selector: call_expression
        captures: { payload: PAYLOAD, type: TYPE }
  tags: [deserialization, type-restriction, json, go]
  ai: *restriction_guidance
  provenance:
    note: A Go JSON decode into an explicit destination mapped to contextual type-restriction evidence.
    references:
      - https://cwe.mitre.org/data/definitions/502.html
      - https://pkg.go.dev/encoding/json#Unmarshal
