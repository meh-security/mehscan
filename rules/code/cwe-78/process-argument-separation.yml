- id: csharp-process-argument-separation
  version: 1
  title: .NET structured process argument
  language: csharp
  kind: sanitizer
  capability: process_argument_separation
  confidence: medium
  cwe: [CWE-78]
  match:
    any:
      - pattern: $START_INFO.ArgumentList.Add($VALUE)
        captures: { process: START_INFO, value: VALUE }
  tags: [command, process, argument-separation, dotnet]
  ai: &argument_guidance
    investigate:
      - whether the executable itself is fixed or constrained
      - whether an explicit shell, command interpreter, or script reintroduces parsing
      - option injection and target-program semantics despite separated arguments
      - platform-specific process and quoting behavior
  provenance:
    note: ProcessStartInfo.ArgumentList mapped to contextual argument-separation evidence.
    references:
      - https://cwe.mitre.org/data/definitions/78.html
      - https://learn.microsoft.com/en-us/dotnet/api/system.diagnostics.processstartinfo.argumentlist

