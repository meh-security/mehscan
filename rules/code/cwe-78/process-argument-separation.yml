- id: python-process-argument-separation
  version: 1
  title: Python subprocess argument sequence without a shell
  language: python
  kind: sanitizer
  capability: process_argument_separation
  confidence: medium
  cwe: [CWE-78]
  match:
    any:
      - pattern: subprocess.Popen([$COMMAND, $$$ARGUMENTS], shell=False)
        captures: { command: COMMAND, arguments: ARGUMENTS }
      - pattern: subprocess.run([$COMMAND, $$$ARGUMENTS], shell=False)
        captures: { command: COMMAND, arguments: ARGUMENTS }
      - pattern: subprocess.call([$COMMAND, $$$ARGUMENTS], shell=False)
        captures: { command: COMMAND, arguments: ARGUMENTS }
      - pattern: subprocess.check_call([$COMMAND, $$$ARGUMENTS], shell=False)
        captures: { command: COMMAND, arguments: ARGUMENTS }
      - pattern: subprocess.check_output([$COMMAND, $$$ARGUMENTS], shell=False)
        captures: { command: COMMAND, arguments: ARGUMENTS }
  tags: [command, process, argument-separation, python]
  ai: *argument_guidance
  provenance:
    note: Python subprocess sequences with an explicitly disabled shell mapped to contextual protection evidence.
    references:
      - https://cwe.mitre.org/data/definitions/78.html
      - https://docs.python.org/3/library/subprocess.html

- id: go-process-argument-separation
  version: 1
  title: Go direct process execution with separate arguments
  language: go
  kind: sanitizer
  capability: process_argument_separation
  confidence: medium
  cwe: [CWE-78]
  match:
    any:
      - pattern: exec.Command($COMMAND, $ARGUMENT)
        context: |
          package pattern
          func patternContext() { exec.Command($COMMAND, $ARGUMENT) }
        selector: call_expression
        captures: { command: COMMAND, arguments: ARGUMENT }
      - pattern: exec.Command($COMMAND, $ARGUMENT, $$$ARGUMENTS)
        captures: { command: COMMAND, arguments: ARGUMENT }
      - pattern: exec.CommandContext($CONTEXT, $COMMAND, $ARGUMENT, $$$ARGUMENTS)
        captures: { command: COMMAND, arguments: ARGUMENT, context: CONTEXT }
  tags: [command, process, argument-separation, go]
  ai: *argument_guidance
  provenance:
    note: Go os/exec program and argument parameters mapped to contextual argument-separation evidence.
    references:
      - https://cwe.mitre.org/data/definitions/78.html
      - https://pkg.go.dev/os/exec

- id: rust-process-argument-separation
