- id: javascript-process-argument-separation
  version: 1
  title: Node.js direct process execution with argument array
  language: javascript
  kind: sanitizer
  capability: process_argument_separation
  confidence: medium
  cwe: [CWE-78]
  match: &node_argument_match
    any:
      - pattern: child_process.execFile($COMMAND, $ARGUMENTS)
        captures: { command: COMMAND, arguments: ARGUMENTS }
      - pattern: child_process.spawn($COMMAND, $ARGUMENTS)
        captures: { command: COMMAND, arguments: ARGUMENTS }
      - pattern: child_process.spawnSync($COMMAND, $ARGUMENTS)
        captures: { command: COMMAND, arguments: ARGUMENTS }
  symbols: &node_argument_symbols
    - canonical: child_process.execFile
      captures: { command: 0, arguments: 1 }
    - canonical: child_process.spawn
      captures: { command: 0, arguments: 1 }
    - canonical: child_process.spawnSync
      captures: { command: 0, arguments: 1 }
  tags: [command, process, argument-separation, nodejs]
  ai: *argument_guidance
  provenance: &node_argument_provenance
    note: Node direct-execution APIs with a separate argument array mapped to contextual protection evidence.
    references:
      - https://cwe.mitre.org/data/definitions/78.html
      - https://nodejs.org/api/child_process.html

