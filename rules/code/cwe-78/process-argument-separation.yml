        captures: { command: COMMAND, arguments: ARGUMENT }
      - pattern: std::process::Command::new($COMMAND).args($ARGUMENTS)
        captures: { command: COMMAND, arguments: ARGUMENTS }
  tags: [command, process, argument-separation, rust]
