- id: javascript-child-process
  version: 1
  title: Node.js child process execution
  language: javascript
  kind: sink
  capability: process_execution
  cwe: [CWE-78]
  match:
    any:
      - pattern: child_process.exec($COMMAND)
        captures: { command: COMMAND }
      - pattern: child_process.execSync($COMMAND)
        captures: { command: COMMAND }
      - pattern: child_process.execFile($COMMAND)
        captures: { command: COMMAND }
      - pattern: child_process.execFile($COMMAND, $$$ARGUMENTS)
        captures: { command: COMMAND, arguments: ARGUMENTS }
      - pattern: child_process.spawn($COMMAND)
        captures: { command: COMMAND }
      - pattern: child_process.spawn($COMMAND, $$$ARGUMENTS)
        captures: { command: COMMAND, arguments: ARGUMENTS }
      - pattern: child_process.spawnSync($COMMAND)
        captures: { command: COMMAND }
      - pattern: child_process.spawnSync($COMMAND, $$$ARGUMENTS)
        captures: { command: COMMAND, arguments: ARGUMENTS }
  symbols: &node_process_symbols
    - canonical: child_process.exec
      captures: { command: 0 }
    - canonical: child_process.execSync
      captures: { command: 0 }
    - canonical: child_process.execFile
      captures: { command: 0, arguments: 1 }
    - canonical: child_process.spawn
      captures: { command: 0, arguments: 1 }
    - canonical: child_process.spawnSync
      captures: { command: 0, arguments: 1 }
  tags: [command, process, nodejs]
  ai: *process_guidance
  provenance: &node_process_provenance
    note: Node.js child-process APIs mapped to the CWE-78 investigation surface.
    references:
      - https://cwe.mitre.org/data/definitions/78.html
      - https://nodejs.org/api/child_process.html

