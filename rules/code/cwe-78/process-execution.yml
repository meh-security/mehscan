        captures: { command: COMMAND, arguments: ARGUMENTS }
      - pattern: syscall.Exec($COMMAND, $ARGUMENTS, $ENVIRONMENT)
        captures: { command: COMMAND, arguments: ARGUMENTS, environment: ENVIRONMENT }
  symbols:
    - canonical: os/exec.Command
      captures: { command: 0 }
    - canonical: os/exec.CommandContext
      captures: { context: 0, command: 1 }
    - canonical: os.StartProcess
      captures: { command: 0, arguments: 1 }
    - canonical: syscall.Exec
      captures: { command: 0, arguments: 1, environment: 2 }
  tags: [command, process]
  ai: *process_guidance
  provenance:
    note: Go process-launch APIs mapped to the CWE-78 investigation surface.
    references:
      - https://cwe.mitre.org/data/definitions/78.html
      - https://pkg.go.dev/os/exec

