- id: csharp-process-start
  version: 1
  title: .NET process execution
  language: csharp
  kind: sink
  capability: process_execution
  cwe: [CWE-78]
  match:
    any:
      - pattern: Process.Start($COMMAND)
        captures: { command: COMMAND }
      - pattern: Process.Start($FILE, $ARGUMENTS)
        captures: { command: FILE, arguments: ARGUMENTS }
      - pattern: System.Diagnostics.Process.Start($COMMAND)
        captures: { command: COMMAND }
  symbols:
    - canonical: System.Diagnostics.Process.Start
      captures: { command: 0, arguments: 1 }
  tags: [command, process]
  ai: &process_guidance
    investigate:
      - origin of the executable and arguments
      - shell interpretation and command construction
      - validation, allowlists, and authorization context
  provenance: &prototype_provenance
    note: Runtime process-launch API mapped to the CWE-78 investigation surface.
    references:
      - https://cwe.mitre.org/data/definitions/78.html
      - https://learn.microsoft.com/en-us/dotnet/api/system.diagnostics.process.start

