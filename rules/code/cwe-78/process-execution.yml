- id: go-process-execution
  version: 1
  title: Go process execution
  language: go
  kind: sink
  capability: process_execution
  cwe: [CWE-78]
  match:
    any:
      - pattern: exec.Command($COMMAND)
        context: |
          package pattern
          func patternContext() { exec.Command($COMMAND) }
        selector: call_expression
        captures: { command: COMMAND }
      - pattern: exec.Command($COMMAND, $$$ARGUMENTS)
        captures: { command: COMMAND, arguments: ARGUMENTS }
      - pattern: exec.CommandContext($CONTEXT, $COMMAND, $$$ARGUMENTS)
        captures: { command: COMMAND, arguments: ARGUMENTS, context: CONTEXT }
  symbols:
    - canonical: os/exec.Command
      captures: { command: 0 }
    - canonical: os/exec.CommandContext
      captures: { context: 0, command: 1 }
  tags: [command, process]
  ai: *process_guidance
  provenance:
    note: Go process-launch APIs mapped to the CWE-78 investigation surface.
    references:
      - https://cwe.mitre.org/data/definitions/78.html
      - https://pkg.go.dev/os/exec

- id: rust-process-execution
  version: 1
  title: Rust process execution
  language: rust
  kind: sink
  capability: process_execution
  cwe: [CWE-78]
  match:
    any:
      - pattern: Command::new($COMMAND)
        captures: { command: COMMAND }
      - pattern: std::process::Command::new($COMMAND)
        captures: { command: COMMAND }
      - pattern: $BUILDER::new($COMMAND)
        captures: { command: COMMAND }
      - pattern: $COMMAND.arg($ARGUMENT)
        captures: { command: COMMAND, arguments: ARGUMENT }
      - pattern: $COMMAND.args($ARGUMENTS)
        captures: { command: COMMAND, arguments: ARGUMENTS }
  tags: [command, process, rust]
  ai: *process_guidance
  provenance:
    note: Rust standard process builder creation and argument attachment mapped to the CWE-78 investigation surface; shell interpretation depends on the selected executable.
    references:
      - https://cwe.mitre.org/data/definitions/78.html
      - https://doc.rust-lang.org/std/process/struct.Command.html
