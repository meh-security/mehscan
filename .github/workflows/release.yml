name: Release

on:
  workflow_dispatch:

permissions: {}

jobs:
  publish-recovery:
    if: github.ref == 'refs/heads/release/v0.16.0-publish-recovery'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      actions: read
      attestations: read
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      RELEASE_TAG: v0.16.0
      RELEASE_COMMIT: 3a4e300f446261a9eea5eec37aa3588fccbb3f98

    steps:
      - name: Check out the tagged release notes
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/tags/v0.16.0
          persist-credentials: false

      - name: Download the attested release files from the original run
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          github-token: ${{ github.token }}
          run-id: '45458489307'
          pattern: mehscan-release-*
          merge-multiple: true
          path: dist

      - name: Verify and publish the exact asset set
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$RELEASE_COMMIT"
          test "$(find dist -maxdepth 1 -type f | wc -l)" -eq 8
          assets=()
          for platform in linux-x86_64 windows-x86_64 macos-x86_64 macos-aarch64; do
            archive="dist/mehscan-$RELEASE_TAG-$platform.zip"
            test -s "$archive"
            test -s "$archive.sha256"
            expected=$(awk 'NR == 1 {print $1}' "$archive.sha256")
            actual=$(sha256sum "$archive" | cut -d' ' -f1)
            test "$actual" = "$expected"
            gh attestation verify "$archive" --repo "$GH_REPO" \
              --signer-workflow "$GH_REPO/.github/workflows/release.yml" \
              --source-ref "refs/tags/$RELEASE_TAG" --source-digest "$RELEASE_COMMIT"
            assets+=("$archive" "$archive.sha256")
          done
          gh release create "$RELEASE_TAG" "${assets[@]}" --repo "$GH_REPO" --verify-tag \
            --notes-file "docs/release-notes-$RELEASE_TAG.md" --title "$RELEASE_TAG"
