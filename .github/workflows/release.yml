name: Release

on:
  push:
    tags:
      - "v*.*.*"
  pull_request:
    branches:
      - main
    paths:
      - ".github/workflows/release.yml"
      - "scripts/build-preview.ps1"
      - "scripts/test-installer.ps1"
      - "scripts/test-unix-installer.py"
      - "skills/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "crates/**"
      - "docs/release-notes-*.md"

permissions: {}

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build, test, and attest (${{ matrix.platform }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    env:
      CARGO_INCREMENTAL: "0"
      CARGO_PROFILE_TEST_DEBUG: line-tables-only
    permissions:
      contents: read
      id-token: write
      attestations: write
      artifact-metadata: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            platform: linux-x86_64
          - os: windows-2025
            platform: windows-x86_64
          - os: macos-15-intel
            platform: macos-x86_64
          - os: macos-15
            platform: macos-aarch64

    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Test public installer contracts
        shell: pwsh
        run: ./scripts/test-installer.ps1

      - name: Test Unix installer contracts
        if: runner.os != 'Windows'
        shell: bash
        run: |
          bash -n skills/mehscan-security/scripts/install-mehscan.sh
          bash skills/mehscan-security/scripts/install-mehscan.sh --help
          python3 -B scripts/test-unix-installer.py

      - name: Verify the tagged commit belongs to main
        if: github.ref_type == 'tag'
        shell: pwsh
        run: |
          git merge-base --is-ancestor $env:GITHUB_SHA origin/main
          if ($LASTEXITCODE -ne 0) {
            throw "Refusing to release a commit that is not reachable from main"
          }

      - name: Install the minimum supported Rust toolchain
        run: rustup toolchain install 1.88.0 --profile minimal --no-self-update

      - name: Select the minimum supported Rust toolchain
        run: rustup default 1.88.0

      - name: Cache Cargo dependencies
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: ${{ runner.os }}-${{ runner.arch }}-release-cargo-1.88.0-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-release-cargo-1.88.0-

      - name: Test all targets
        run: cargo test --all-targets --locked

      - name: Build and smoke-test the release archive
        shell: pwsh
        run: |
          if ("${{ github.ref_type }}" -eq "tag") {
            $version = "${{ github.ref_name }}".TrimStart("v")
            $package = ./scripts/build-preview.ps1 -Version $version | ConvertFrom-Json
          } else {
            $package = ./scripts/build-preview.ps1 | ConvertFrom-Json
          }
          if ($package.platform -cne "${{ matrix.platform }}") {
            throw "Unexpected archive platform: $($package.platform)"
          }
          $package | ConvertTo-Json -Depth 5

      - name: Attest the CI-built release archive
        if: github.ref_type == 'tag'
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: target/release-artifacts/*.zip

      - name: Upload the release archive and checksum
        if: github.ref_type == 'tag'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: mehscan-release-${{ matrix.platform }}
          path: |
            target/release-artifacts/*.zip
            target/release-artifacts/*.zip.sha256
          if-no-files-found: error
          retention-days: 1

  publish:
    name: Publish GitHub release
    if: github.ref_type == 'tag'
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write

    steps:
      - name: Check out the tagged release notes
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Download the attested release files
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: mehscan-release-*
          merge-multiple: true
          path: dist

      - name: Verify the complete release asset set
        shell: pwsh
        run: |
          $expected = @('linux-x86_64', 'windows-x86_64', 'macos-x86_64', 'macos-aarch64') | ForEach-Object {
            "mehscan-$env:GITHUB_REF_NAME-$_.zip"
            "mehscan-$env:GITHUB_REF_NAME-$_.zip.sha256"
          } | Sort-Object
          $actual = @(Get-ChildItem dist -File | Select-Object -ExpandProperty Name | Sort-Object)
          if (($actual -join "`n") -cne ($expected -join "`n")) {
            throw "Release requires all four platform archives and their checksums"
          }
          foreach ($archive in Get-ChildItem dist -Filter '*.zip') {
            $recorded = ((Get-Content "$($archive.FullName).sha256" -Raw).Trim() -split '\s+')[0]
            $actualHash = (Get-FileHash $archive.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
            if ($recorded -cne $actualHash) { throw "Checksum mismatch: $($archive.Name)" }
          }
          if (-not (Test-Path "docs/release-notes-$env:GITHUB_REF_NAME.md" -PathType Leaf)) {
            throw "Missing reviewed release notes"
          }

      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release create "${GITHUB_REF_NAME}"
          dist/*
          --repo "${GITHUB_REPOSITORY}"
          --verify-tag
          --notes-file "docs/release-notes-${GITHUB_REF_NAME}.md"
          --title "${GITHUB_REF_NAME}"
