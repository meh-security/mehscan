name: CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    env:
      CARGO_INCREMENTAL: "0"
      CARGO_PROFILE_TEST_DEBUG: "0"
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - windows-latest
          - macos-latest

    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install the minimum supported Rust toolchain
        run: rustup toolchain install 1.88.0 --profile minimal --component rustfmt --no-self-update

      - name: Set up Python
        # Worker/provider runtime and Action test suites use this interpreter.
        uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c # v6.0.0
        with:
          python-version: '3.13'

      - name: Install Python test dependencies
        run: python -m pip install --requirement scripts/requirements-ci.txt

      - name: Select the minimum supported Rust toolchain
        run: rustup default 1.88.0

      - name: Cache Cargo dependencies
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: ${{ runner.os }}-cargo-1.88.0-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-1.88.0-

      - name: Check formatting
        if: runner.os == 'Linux'
        run: cargo fmt --all -- --check

      - name: Build and test all targets
        run: cargo test --all-targets --locked

      - name: Build the optimized scanner for native integration tests
        shell: pwsh
        run: |
          cargo build -p mehscan-cli --release --locked
          if ($LASTEXITCODE -ne 0) { throw 'Optimized scanner build failed' }
          $binaryName = if ($IsWindows) { 'mehscan.exe' } else { 'mehscan' }
          $scanner = Join-Path $env:GITHUB_WORKSPACE "target/release/$binaryName"
          "MEHSCAN_TEST_SCANNER=$scanner" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Test advisory GitHub lifecycle and native adapter
        env:
          MEHSCAN_REQUIRE_NATIVE_TESTS: "true"
        run: python -m unittest discover -s tests/github_action -v

      - name: Run the CLI acceptance test
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./scripts/test-e2e.ps1 -SkipBuild

      - name: Test provider-neutral review worker with native admission
        run: python scripts/test-review-suites.py --output test-results/review-worker.json

      - name: Save worker test classifications and timings
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: review-worker-tests-${{ matrix.os }}
          path: test-results/review-worker.json
          if-no-files-found: ignore

      - name: Test BYOK provider protocol and process execution
        run: python -m unittest discover -s tests/provider_adapter -v
