name: CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      include_research:
        description: Run the experimental review worker tests as well
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: ${{ startsWith(matrix.os, 'macos-') && 75 || 60 }}
    env:
      CARGO_INCREMENTAL: "0"
      CARGO_PROFILE_TEST_DEBUG: "0"
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - windows-latest
          # Hosted ARM jobs have repeatedly been cancelled while queued on PRs.
          - ${{ github.event_name == 'pull_request' && 'macos-15-intel' || 'macos-latest' }}

    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install the minimum supported Rust toolchain
        run: rustup toolchain install 1.88.0 --profile minimal --component rustfmt --no-self-update

      - name: Set up Python
        # Worker/provider runtime and Action test suites use this interpreter.
        uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c # v6.0.0
        with:
          python-version: '3.13'

      - name: Install Python test dependencies
        run: python -m pip install --requirement scripts/requirements-ci.txt

      - name: Select the minimum supported Rust toolchain
        run: rustup default 1.88.0

      - name: Cache Cargo dependencies
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: ${{ runner.os }}-cargo-1.88.0-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-1.88.0-

      - name: Check formatting
        if: runner.os == 'Linux'
        run: cargo fmt --all -- --check

      - name: Test Cargo batch orchestration
        run: python -m unittest discover -s tests/ci -v

      - name: Build and test all targets
        run: python scripts/test-cargo-batches.py

      - name: Run the CLI acceptance test
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./scripts/test-e2e.ps1 -SkipBuild

      # Share one macOS runner between Rust and integration tests.
      - name: Test native review integration
        if: runner.os == 'macOS'
        uses: ./.github/actions/test-review-integration
        with:
          worker-tier: ${{ inputs.include_research && 'all' || 'product' }}
          artifact-name: review-worker-tests-${{ matrix.os }}

  integration:
    name: Integration (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    env:
      CARGO_INCREMENTAL: "0"
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - windows-latest

    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install the minimum supported Rust toolchain
        run: rustup toolchain install 1.88.0 --profile minimal --no-self-update

      - name: Set up Python
        uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c # v6.0.0
        with:
          python-version: '3.13'

      - name: Install Python test dependencies
        run: python -m pip install --requirement scripts/requirements-ci.txt

      - name: Restore Cargo dependencies
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: ${{ runner.os }}-cargo-1.88.0-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-1.88.0-

      - name: Test native review integration
        uses: ./.github/actions/test-review-integration
        with:
          worker-tier: ${{ inputs.include_research && 'all' || 'product' }}
          artifact-name: review-worker-tests-${{ matrix.os }}
