# Keep this workflow and the tool pin on the protected default branch.
name: Mehscan hosted PR review
on:
  pull_request_target:
    branches: [main]
    types: [opened, reopened, synchronize, ready_for_review]
  workflow_dispatch:
    inputs:
      pull_request:
        description: Pull request number
        type: number
        required: true
      full_review:
        description: Review the full PR diff comprehensively
        type: boolean
        default: false

permissions:
  contents: read
  pull-requests: read
  id-token: write

concurrency:
  group: mehscan-hosted-pr-${{ github.event.pull_request.number || inputs.pull_request }}
  cancel-in-progress: false

jobs:
  review:
    if: >-
      github.ref == format('refs/heads/{0}', github.event.repository.default_branch) &&
      (github.event_name == 'workflow_dispatch' ||
        (!github.event.pull_request.draft && github.event.pull_request.head.repo.id == github.event.repository.id))
    runs-on: ubuntu-latest
    environment: Review
    timeout-minutes: 30
    steps:
      - name: Set up Python
        uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c # v6.0.0
        with:
          python-version: '3.13'
      - name: Validate the trusted tool pin
        env:
          MEHSCAN_COMMIT: ${{ vars.MEHSCAN_COMMIT }}
        run: python -I -c 'import os,re,sys; sys.exit(not bool(re.fullmatch(r"[0-9a-f]{40}", os.environ["MEHSCAN_COMMIT"])))'
      - name: Check out trusted Mehscan tools
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: meh-security/mehscan
          ref: ${{ vars.MEHSCAN_COMMIT }}
          path: .mehscan-tool
          persist-credentials: false
      - name: Set up the trusted scanner and reviewer dependencies
        env:
          CARGO_TARGET_DIR: ${{ runner.temp }}/mehscan-build
        run: |
          rustup toolchain install 1.88.0 --profile minimal --no-self-update
          cargo +1.88.0 build --release --locked --package mehscan-cli --manifest-path .mehscan-tool/Cargo.toml
          python -m pip install --requirement .mehscan-tool/skills/mehscan-security/scripts/requirements.txt
      - name: Link the enrolled repository
        env:
          MEHSCAN_SHARE_HOST: ${{ vars.MEHSCAN_SHARE_HOST }}
          MEHSCAN_SHARE_AUDIENCE: ${{ vars.MEHSCAN_SHARE_AUDIENCE }}
          MEHSCAN_OIDC_AUDIENCE: ${{ vars.MEHSCAN_OIDC_AUDIENCE }}
          MEHSCAN_REPOSITORY_ID: ${{ github.repository_id }}
        run: |
          mkdir "$GITHUB_WORKSPACE/mehscan-source"
          python -Es .mehscan-tool/scripts/review_share.py link --host "$MEHSCAN_SHARE_HOST" \
            --repository-id "$MEHSCAN_REPOSITORY_ID" --audience "$MEHSCAN_SHARE_AUDIENCE" \
            --oidc-audience "$MEHSCAN_OIDC_AUDIENCE" --source-root "$GITHUB_WORKSPACE/mehscan-source" \
            --output "$RUNNER_TEMP/mehscan-link.json"
      - name: Prepare the trusted reviewer configuration
        env:
          MEHSCAN_CODEX_AUTH_JSON: ${{ secrets.MEHSCAN_CODEX_AUTH_JSON }}
          MEHSCAN_CODEX_VERSION: ${{ vars.MEHSCAN_CODEX_VERSION || '0.162.0-alpha.17.2' }}
          MEHSCAN_REVIEW_MODEL: ${{ vars.MEHSCAN_REVIEW_MODEL || 'gpt-6.1-terra' }}
        run: python -I .mehscan-tool/scripts/setup-action-provider.py --private-root "$RUNNER_TEMP/mehscan-provider" --version "$MEHSCAN_CODEX_VERSION" --model "$MEHSCAN_REVIEW_MODEL"
      - name: Review the pinned PR snapshot
        id: mehscan
        uses: ./.mehscan-tool
        with:
          scanner-path: ${{ runner.temp }}/mehscan-build/release/mehscan
          source-path: mehscan-source
          pull-request: ${{ inputs.pull_request }}
          review-mode: ${{ inputs.full_review && 'comprehensive' || 'value' }}
          provider-config: ${{ runner.temp }}/mehscan-provider/config.json
          sharing-link: ${{ runner.temp }}/mehscan-link.json
      - name: Retain advisory artifacts
        if: always() && !cancelled() && steps.mehscan.outputs.artifact-directory != ''
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ steps.mehscan.outputs.artifact-name }}
          path: ${{ steps.mehscan.outputs.artifact-directory }}
          retention-days: 7
          if-no-files-found: error
